<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>涂鸦特工 - 滑板版</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Microsoft YaHei', sans-serif; }
        
        #gameCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        
        #start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #start-screen h1 {
            font-size: 48px;
            color: #fff;
            text-shadow: 0 0 20px #00d4ff;
            margin-bottom: 20px;
        }
        #start-screen p { color: #aaa; font-size: 18px; margin: 10px 0; }
        #start-btn {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 24px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
        }
        #start-btn:hover { transform: scale(1.1); }
        
        #camera-preview {
            width: 320px; height: 240px;
            border-radius: 15px;
            border: 3px solid #00d4ff;
            background: #000;
            margin: 20px 0;
            overflow: hidden;
        }
        #camera-preview video { width: 1px; height: 1px; }
        #camera-preview canvas { width: 100%; height: 100%; }
        
        #camera-status { color: #0f0; font-size: 16px; margin-top: 10px; }
        
        #gesture-guide {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }
        .gesture-item { text-align: center; color: #fff; }
        .gesture-icon { font-size: 48px; }
        .gesture-label { font-size: 14px; color: #aaa; margin-top: 5px; }
        
        #ui-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: none;
        }
        
        #minimap {
            position: absolute;
            top: 20px; left: 20px;
            width: 200px; height: 200px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #00d4ff;
            border-radius: 10px;
        }
        #minimap canvas { width: 100%; height: 100%; }
        
        #status-bar {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
        }
        #status-bar h3 { color: #00d4ff; margin-bottom: 10px; }
        #status-bar p { margin: 5px 0; font-size: 14px; }
        #score-display { font-size: 24px; color: #ff0; }
        
        #gesture-panel {
            position: absolute;
            bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
            text-align: center;
        }
        #detected-gesture { font-size: 48px; }
        #gesture-name { color: #0f0; margin-top: 5px; }
        
        #controls-hint {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 30px;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
        }
        
        #wall-warning {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,0,0,0.9);
            padding: 20px 40px;
            border-radius: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            display: none;
        }
        
        #goal-reached {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,255,0,0.95);
            padding: 40px 60px;
            border-radius: 20px;
            color: #000;
            font-size: 36px;
            font-weight: bold;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="start-screen">
        <h1>🎨 涂鸦特工</h1>
        <p>滑板版 - 收集喷罐，到达终点！</p>
        
        <div id="camera-preview">
            <video id="camera-video" playsinline></video>
            <canvas id="camera-canvas"></canvas>
            <div id="camera-placeholder" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#666;">
                摄像头加载中...
            </div>
        </div>
        
        <div id="camera-status">📷 正在启动摄像头...</div>
        
        <div id="gesture-guide">
            <div class="gesture-item">
                <div class="gesture-icon">👈</div>
                <div class="gesture-label">向左挥手 = 左转</div>
            </div>
            <div class="gesture-item">
                <div class="gesture-icon">🖐️</div>
                <div class="gesture-label">向上挥手 = 加速</div>
            </div>
            <div class="gesture-item">
                <div class="gesture-icon">👉</div>
                <div class="gesture-label">向右挥手 = 右转</div>
            </div>
            <div class="gesture-item">
                <div class="gesture-icon">✊</div>
                <div class="gesture-label">攥拳 = 刹车</div>
            </div>
        </div>
        
        <button id="start-btn">🎮 开始游戏</button>
        <p style="color:#666;margin-top:15px;font-size:12px;">或者按任意键/点击页面开始</p>
    </div>
    
    <div id="ui-layer">
        <canvas id="minimap"></canvas>
        
        <div id="status-bar">
            <h3>📊 状态</h3>
            <p>收集: <span id="score-display">0</span> / <span id="total-cans">0</span></p>
            <p>速度: <span id="speed-display">0</span></p>
            <p>距离终点: <span id="distance-display">0</span>m</p>
        </div>
        
        <div id="gesture-panel">
            <div id="detected-gesture">🖐️</div>
            <div id="gesture-name">等待手势...</div>
        </div>
        
        <div id="controls-hint">
            👈向左挥/向右挥👉 转向 | 🖐️向上挥加速 | ✊攥拳刹车
        </div>
        
        <div id="wall-warning">🚧 障碍墙！请转向！</div>
        
        <div id="goal-reached">
            🎉 到达终点！<br>
            <span style="font-size:18px;">按R重新开始</span>
        </div>
    </div>
    
    <script>
    // ============ 游戏状态 ============
    const state = {
        started: false,
        gameOver: false,
        score: 0,
        playerX: 0,
        playerY: 0,
        playerZ: 0,
        playerDir: 0,  // 0 = 向上(-Z方向)
        playerSpeed: 0,
        maxSpeed: 8
    };
    
    // ============ 道路节点系统 ============
    // 创建道路网络
    const roadNodes = [];
    const roadEdges = [];
    const walls = [];
    const sprayCans = [];
    let goalNode = null;
    
    function createRoadNetwork() {
        // 起点 (0,0)
        roadNodes.push({ id: 0, x: 0, z: 0, type: 'start' });
        
        // 第一层分叉 (z = -150) - 更分散
        roadNodes.push({ id: 1, x: -80, z: -150, type: 'junction' });  // 左
        roadNodes.push({ id: 2, x: 0, z: -150, type: 'junction' });    // 中
        roadNodes.push({ id: 3, x: 80, z: -150, type: 'junction' });   // 右
        
        // 第二层 (z = -300)
        roadNodes.push({ id: 4, x: -100, z: -300, type: 'junction' });
        roadNodes.push({ id: 5, x: -40, z: -300, type: 'junction' });
        roadNodes.push({ id: 6, x: 40, z: -300, type: 'junction' });
        roadNodes.push({ id: 7, x: 100, z: -300, type: 'junction' });
        
        // 第三层 (z = -450)
        roadNodes.push({ id: 8, x: -80, z: -450, type: 'junction' });
        roadNodes.push({ id: 9, x: 0, z: -450, type: 'junction' });
        roadNodes.push({ id: 10, x: 80, z: -450, type: 'junction' });
        
        // 终点 (z = -600)
        roadNodes.push({ id: 11, x: 0, z: -600, type: 'goal' });
        goalNode = roadNodes[11];
        
        // 道路连接
        roadEdges.push({ from: 0, to: 1 }, { from: 0, to: 2 }, { from: 0, to: 3 });
        roadEdges.push({ from: 1, to: 4 }, { from: 1, to: 5 });
        roadEdges.push({ from: 2, to: 5 }, { from: 2, to: 6 });
        roadEdges.push({ from: 3, to: 6 }, { from: 3, to: 7 });
        roadEdges.push({ from: 4, to: 8 }, { from: 5, to: 8 }, { from: 5, to: 9 });
        roadEdges.push({ from: 6, to: 9 }, { from: 6, to: 10 }, { from: 7, to: 10 });
        roadEdges.push({ from: 8, to: 11 }, { from: 9, to: 11 }, { from: 10, to: 11 });
        
        // 环路
        roadEdges.push({ from: 4, to: 2 }, { from: 7, to: 2 });
        
        // 障碍墙（路口处，只挡一边）
        walls.push({ x: -40, z: -150, width: 40, height: 15, active: true });  // 第一层左路有墙
        walls.push({ x: 40, z: -300, width: 40, height: 15, active: true });   // 第二层右路有墙
        walls.push({ x: -40, z: -450, width: 40, height: 15, active: true }); // 第三层左路有墙
        
        // 喷漆罐 - 分散放置，每条路1-2个
        roadEdges.forEach((edge, i) => {
            if (i % 2 === 0) {  // 每隔一条路放一个
                const from = roadNodes[edge.from];
                const to = roadNodes[edge.to];
                sprayCans.push({
                    x: (from.x + to.x) / 2 + (Math.random() - 0.5) * 15,
                    z: (from.z + to.z) / 2,
                    collected: false,
                    color: ['#ff0', '#f0f', '#0ff', '#f00', '#0f0'][Math.floor(Math.random() * 5)]
                });
            }
        });
        
        // 额外喷罐 - 分散在主要道路上
        const mainRoads = [
            { x: 0, z: -75 }, { x: 0, z: -225 }, { x: 0, z: -375 }, { x: 0, z: -525 },
            { x: -40, z: -225 }, { x: 40, z: -375 }
        ];
        mainRoads.forEach(pos => {
            sprayCans.push({
                x: pos.x + (Math.random() - 0.5) * 10,
                z: pos.z,
                collected: false,
                color: '#ff0'
            });
        });
    }
    
    createRoadNetwork();
    
    // ============ 画布设置 ============
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const minimapCtx = minimapCanvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        minimapCanvas.width = 200;
        minimapCanvas.height = 200;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    // ============ 2.5D渲染系统 ============
    const VIEW_DISTANCE = 400;  // 视野距离
    const ROAD_WIDTH = 60;      // 道路宽度 - 加宽！
    
    function worldToScreen(x, z) {
        // 相对玩家的位置
        const dx = x - state.playerX;
        const dz = z - state.playerZ;
        
        // 旋转到玩家视角
        const cos = Math.cos(-state.playerDir);
        const sin = Math.sin(-state.playerDir);
        const rx = dx * cos - dz * sin;
        const rz = dx * sin + dz * cos;
        
        // 只显示前方的物体
        if (rz < 5 || rz > VIEW_DISTANCE) return null;
        
        // 透视投影
        const fov = 400;
        const scale = fov / rz;
        
        const screenX = canvas.width / 2 + rx * scale;
        const screenY = canvas.height * 0.7 + 100 * scale;
        
        return { x: screenX, y: screenY, scale: scale, dist: rz };
    }
    
    // ============ 渲染场景 ============
    function drawScene() {
        // 天空
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#0a0a1a');
        grad.addColorStop(0.5, '#1a1a3e');
        grad.addColorStop(1, '#2a2a4e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 地平线
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);
        
        // 绘制所有物体（按距离排序）
        const allObjects = [];
        
        // 添加道路
        roadEdges.forEach(edge => {
            const from = roadNodes[edge.from];
            const to = roadNodes[edge.to];
            allObjects.push({
                type: 'road',
                z: (from.z + to.z) / 2,
                from: from, to: to
            });
        });
        
        // 添加墙壁
        walls.forEach(wall => {
            if (wall.active) {
                allObjects.push({ type: 'wall', z: wall.z, wall: wall });
            }
        });
        
        // 添加喷罐
        sprayCans.forEach(can => {
            if (!can.collected) {
                allObjects.push({ type: 'can', z: can.z, can: can });
            }
        });
        
        // 添加终点
        if (goalNode) {
            allObjects.push({ type: 'goal', z: goalNode.z, goal: goalNode });
        }
        
        // 按距离排序（远的先画）
        allObjects.sort((a, b) => b.z - a.z);
        
        // 绘制
        allObjects.forEach(obj => {
            switch(obj.type) {
                case 'road': drawRoad(obj.from, obj.to); break;
                case 'wall': drawWall(obj.wall); break;
                case 'can': drawCan(obj.can); break;
                case 'goal': drawGoal(obj.goal); break;
            }
        });
        
        // 绘制滑板
        drawSkateboard();
    }
    
    function drawRoad(from, to) {
        const p1 = worldToScreen(from.x - ROAD_WIDTH/2, from.z);
        const p2 = worldToScreen(from.x + ROAD_WIDTH/2, from.z);
        const p3 = worldToScreen(to.x + ROAD_WIDTH/2, to.z);
        const p4 = worldToScreen(to.x - ROAD_WIDTH/2, to.z);
        
        if (!p1 || !p2 || !p3 || !p4) return;
        
        // 道路面
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.fill();
        
        // 道路边线
        ctx.strokeStyle = '#00d4ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.stroke();
        
        // 中线
        ctx.strokeStyle = '#f80';
        ctx.setLineDash([5, 5]);
        const mid1 = worldToScreen((from.x + to.x) / 2 - 2, from.z);
        const mid2 = worldToScreen((from.x + to.x) / 2 + 2, to.z);
        if (mid1 && mid2) {
            ctx.beginPath();
            ctx.moveTo(mid1.x, mid1.y);
            ctx.lineTo(mid2.x, mid2.y);
            ctx.stroke();
        }
        ctx.setLineDash([]);
    }
    
    function drawWall(wall) {
        const left = worldToScreen(wall.x - wall.width/2, wall.z);
        const right = worldToScreen(wall.x + wall.width/2, wall.z);
        const top = worldToScreen(wall.x, wall.z - 5);
        
        if (!left || !right) return;
        
        const height = wall.height * left.scale;
        
        // 墙体
        ctx.fillStyle = '#f00';
        ctx.fillRect(left.x, left.y - height, right.x - left.x, height);
        
        // 警告条纹
        ctx.strokeStyle = '#ff0';
        ctx.lineWidth = 3;
        for (let i = 0; i < right.x - left.x; i += 15) {
            ctx.beginPath();
            ctx.moveTo(left.x + i, left.y);
            ctx.lineTo(left.x + i + 10, left.y - height);
            ctx.stroke();
        }
        
        // 文字
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🚧', (left.x + right.x) / 2, left.y - height / 2);
    }
    
    function drawCan(can) {
        const proj = worldToScreen(can.x, can.z);
        if (!proj) return;
        
        const size = 15 * proj.scale;
        
        // 喷罐
        ctx.fillStyle = can.color;
        ctx.shadowColor = can.color;
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(proj.x, proj.y - size, size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // 罐身
        ctx.fillStyle = '#fff';
        ctx.fillRect(proj.x - size/3, proj.y - size * 1.5, size * 0.6, size);
        ctx.fillStyle = can.color;
        ctx.fillRect(proj.x - size/4, proj.y - size * 1.3, size * 0.5, size * 0.6);
    }
    
    function drawGoal(goal) {
        const proj = worldToScreen(goal.x, goal.z);
        if (!proj) return;
        
        const size = 30 * proj.scale;
        
        // 终点标志
        ctx.fillStyle = '#0f0';
        ctx.shadowColor = '#0f0';
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(proj.x, proj.y - size, size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = '#000';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🏁', proj.x, proj.y - size + 7);
    }
    
    function drawSkateboard() {
        const x = canvas.width / 2;
        const y = canvas.height * 0.85;
        const w = 80;
        const h = 20;
        
        // 滑板板面
        ctx.fillStyle = '#8B4513';
        ctx.beginPath();
        ctx.roundRect(x - w/2, y - h/2, w, h, 10);
        ctx.fill();
        
        // 滑板图案
        ctx.fillStyle = '#00ff88';
        ctx.beginPath();
        ctx.arc(x, y, 15, 0, Math.PI * 2);
        ctx.fill();
        
        // 轮子
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(x - w/3, y + h/2 + 5, 8, 0, Math.PI * 2);
        ctx.arc(x + w/3, y + h/2 + 5, 8, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // ============ 迷你地图 ============
    function drawMinimap() {
        minimapCtx.fillStyle = 'rgba(0,0,0,0.9)';
        minimapCtx.fillRect(0, 0, 200, 200);
        
        const scale = 0.35;
        const centerX = 100;
        const centerY = 180;
        
        // 绘制道路
        minimapCtx.strokeStyle = '#444';
        minimapCtx.lineWidth = 3;
        roadEdges.forEach(edge => {
            const from = roadNodes[edge.from];
            const to = roadNodes[edge.to];
            
            const x1 = centerX + (from.x - state.playerX) * scale;
            const y1 = centerY + (from.z - state.playerZ) * scale;
            const x2 = centerX + (to.x - state.playerX) * scale;
            const y2 = centerY + (to.z - state.playerZ) * scale;
            
            minimapCtx.beginPath();
            minimapCtx.moveTo(x1, y1);
            minimapCtx.lineTo(x2, y2);
            minimapCtx.stroke();
        });
        
        // 绘制墙壁
        walls.forEach(wall => {
            if (!wall.active) return;
            const wx = centerX + (wall.x - state.playerX) * scale;
            const wy = centerY + (wall.z - state.playerZ) * scale;
            if (wx < 0 || wx > 200 || wy < 0 || wy > 200) return;
            
            minimapCtx.fillStyle = '#f00';
            minimapCtx.fillRect(wx - 5, wy - 3, 10, 6);
        });
        
        // 绘制喷罐
        sprayCans.forEach(can => {
            if (can.collected) return;
            const cx = centerX + (can.x - state.playerX) * scale;
            const cy = centerY + (can.z - state.playerZ) * scale;
            if (cx < 0 || cx > 200 || cy < 0 || cy > 200) return;
            
            minimapCtx.fillStyle = can.color;
            minimapCtx.beginPath();
            minimapCtx.arc(cx, cy, 3, 0, Math.PI * 2);
            minimapCtx.fill();
        });
        
        // 绘制终点
        if (goalNode) {
            const gx = centerX + (goalNode.x - state.playerX) * scale;
            const gy = centerY + (goalNode.z - state.playerZ) * scale;
            if (gx > 0 && gx < 200 && gy > 0 && gy < 200) {
                minimapCtx.fillStyle = '#0f0';
                minimapCtx.beginPath();
                minimapCtx.arc(gx, gy, 5, 0, Math.PI * 2);
                minimapCtx.fill();
            }
        }
        
        // 绘制玩家
        minimapCtx.fillStyle = '#0f0';
        minimapCtx.beginPath();
        minimapCtx.arc(centerX, centerY, 5, 0, Math.PI * 2);
        minimapCtx.fill();
        
        // 方向箭头
        minimapCtx.strokeStyle = '#fff';
        minimapCtx.lineWidth = 2;
        minimapCtx.beginPath();
        minimapCtx.moveTo(centerX, centerY);
        minimapCtx.lineTo(
            centerX - Math.sin(state.playerDir) * 12,
            centerY - Math.cos(state.playerDir) * 12
        );
        minimapCtx.stroke();
    }
    
    // ============ 碰撞检测 ============
    function checkCollisions() {
        // 喷罐
        sprayCans.forEach(can => {
            if (can.collected) return;
            const dx = can.x - state.playerX;
            const dz = can.z - state.playerZ;
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist < 8) {
                can.collected = true;
                state.score++;
            }
        });
        
        // 墙壁
        let nearWall = false;
        walls.forEach(wall => {
            if (!wall.active) return;
            const dx = wall.x - state.playerX;
            const dz = wall.z - state.playerZ;
            const dist = Math.sqrt(dx * dx + dz * dz);
            
            if (dist < 25) nearWall = true;
            
            if (dist < 15) {
                state.playerSpeed *= 0.1;
                // 弹开
                state.playerX -= Math.sin(state.playerDir) * 5;
                state.playerZ -= Math.cos(state.playerDir) * 5;
            }
        });
        
        document.getElementById('wall-warning').style.display = nearWall ? 'block' : 'none';
        
        // 终点
        if (goalNode) {
            const dx = goalNode.x - state.playerX;
            const dz = goalNode.z - state.playerZ;
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist < 15) {
                state.gameOver = true;
                document.getElementById('goal-reached').style.display = 'block';
            }
        }
    }
    
    // ============ 更新UI ============
    function updateUI() {
        document.getElementById('score-display').textContent = state.score;
        document.getElementById('total-cans').textContent = sprayCans.length;
        document.getElementById('speed-display').textContent = state.playerSpeed.toFixed(1);
        
        if (goalNode) {
            const dx = goalNode.x - state.playerX;
            const dz = goalNode.z - state.playerZ;
            const dist = Math.sqrt(dx * dx + dz * dz);
            document.getElementById('distance-display').textContent = Math.floor(dist);
        }
    }
    
    // ============ 游戏循环 ============
    function gameLoop() {
        if (state.started && !state.gameOver) {
            if (state.playerSpeed > 0.01) {
                state.playerX += Math.sin(state.playerDir) * state.playerSpeed;
                state.playerZ += Math.cos(state.playerDir) * state.playerSpeed;
                state.playerSpeed *= 0.995;
                if (state.playerSpeed < 0.1) state.playerSpeed = 0;
            }
            checkCollisions();
        }
        
        drawScene();
        drawMinimap();
        updateUI();
        
        requestAnimationFrame(gameLoop);
    }
    
    // ============ 体感控制 ============
    let gestureCooldown = 0;
    let waveCount = 0;
    let lastWaveTime = 0;
    
    function detectGesture(landmarks) {
        if (gestureCooldown > 0) {
            gestureCooldown--;
            return null;
        }
        
        const wrist = landmarks[0];
        const thumb = landmarks[4];
        const index = landmarks[8];
        const pinky = landmarks[20];
        
        const thumbIndexDist = Math.sqrt(
            Math.pow(thumb.x - index.x, 2) + Math.pow(thumb.y - index.y, 2)
        );
        
        const isFist = thumbIndexDist < 0.05;
        const isWaveUp = wrist.y < 0.4;
        const isWaveLeft = wrist.x < 0.35;
        const isWaveRight = wrist.x > 0.65;
        
        if (isFist) return 'fist';
        if (isWaveUp) return 'wave_up';
        if (isWaveLeft) return 'wave_left';
        if (isWaveRight) return 'wave_right';
        
        return null;
    }
    
    function handleGesture(gesture) {
        const gestureIcon = document.getElementById('detected-gesture');
        const gestureName = document.getElementById('gesture-name');
        
        switch(gesture) {
            case 'wave_left':
                gestureIcon.textContent = '👈';
                gestureName.textContent = '左转！';
                state.playerDir -= Math.PI / 10;
                break;
            case 'wave_right':
                gestureIcon.textContent = '👉';
                gestureName.textContent = '右转！';
                state.playerDir += Math.PI / 10;
                break;
            case 'wave_up':
                gestureIcon.textContent = '🖐️';
                gestureName.textContent = '加速！';
                state.playerSpeed = Math.min(state.maxSpeed, state.playerSpeed + 1);
                break;
            case 'fist':
                gestureIcon.textContent = '✊';
                gestureName.textContent = '刹车！';
                state.playerSpeed *= 0.3;
                break;
        }
        
        gestureCooldown = 30;
    }
    
    // ============ 摄像头初始化 ============
    async function initCamera() {
        const videoElement = document.getElementById('camera-video');
        const canvasElement = document.getElementById('camera-canvas');
        const placeholder = document.getElementById('camera-placeholder');
        const statusEl = document.getElementById('camera-status');
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 640, height: 480 } 
            });
            videoElement.srcObject = stream;
            await videoElement.play();
            
            placeholder.style.display = 'none';
            statusEl.textContent = '✅ 摄像头已启动 - 挥动手开始游戏';
            statusEl.style.color = '#0f0';
            
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
            });
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            
            hands.onResults((results) => {
                const ctx = canvasElement.getContext('2d');
                canvasElement.width = videoElement.videoWidth || 320;
                canvasElement.height = videoElement.videoHeight || 240;
                ctx.save();
                ctx.transform(-1, 0, 0, 1, canvasElement.width, 0);
                ctx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                ctx.restore();
                
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    
                    ctx.strokeStyle = '#00d4ff';
                    ctx.lineWidth = 2;
                    landmarks.forEach((landmark) => {
                        const x = landmark.x * canvasElement.width;
                        const y = landmark.y * canvasElement.height;
                        ctx.beginPath();
                        ctx.arc(x, y, 4, 0, Math.PI * 2);
                        ctx.stroke();
                    });
                    
                    const gesture = detectGesture(landmarks);
                    
                    if (!state.started) {
                        if (gesture === 'wave_up') {
                            const now = Date.now();
                            if (now - lastWaveTime > 500) {
                                waveCount++;
                                lastWaveTime = now;
                                statusEl.textContent = `📷 挥动 ${waveCount}/2 次开始游戏`;
                                
                                if (waveCount >= 2) {
                                    startGame();
                                }
                            }
                        }
                    } else {
                        handleGesture(gesture);
                    }
                }
            });
            
            const processFrame = async () => {
                if (videoElement.readyState >= 2) {
                    await hands.send({ image: videoElement });
                }
                requestAnimationFrame(processFrame);
            };
            processFrame();
            
        } catch (err) {
            console.error('摄像头错误:', err);
            statusEl.textContent = '❌ 摄像头启动失败: ' + err.message;
            statusEl.style.color = '#f00';
        }
    }
    
    // ============ 开始游戏 ============
    function startGame() {
        if (state.started) return;
        state.started = true;
        state.playerSpeed = 0;
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'block';
    }
    
    function resetGame() {
        state.started = false;
        state.gameOver = false;
        state.score = 0;
        state.playerX = 0;
        state.playerZ = 0;
        state.playerDir = 0;
        state.playerSpeed = 0;
        
        sprayCans.forEach(c => c.collected = false);
        walls.forEach(w => w.active = true);
        
        document.getElementById('goal-reached').style.display = 'none';
        document.getElementById('start-screen').style.display = 'flex';
        document.getElementById('ui-layer').style.display = 'none';
    }
    
    // ============ 事件绑定 ============
    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('start-screen').onclick = (e) => {
        if (e.target.id !== 'start-btn') startGame();
    };
    
    document.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'r' && state.gameOver) {
            resetGame();
            return;
        }
        
        if (!state.started) {
            startGame();
            return;
        }
        
        switch(e.key.toLowerCase()) {
            case 'w':
            case 'arrowup':
                state.playerSpeed = Math.min(state.maxSpeed, state.playerSpeed + 1);
                document.getElementById('detected-gesture').textContent = '🖐️';
                document.getElementById('gesture-name').textContent = '加速！';
                break;
            case 'a':
            case 'arrowleft':
                state.playerDir -= Math.PI / 10;
                document.getElementById('detected-gesture').textContent = '👈';
                document.getElementById('gesture-name').textContent = '左转！';
                break;
            case 'd':
            case 'arrowright':
                state.playerDir += Math.PI / 10;
                document.getElementById('detected-gesture').textContent = '👉';
                document.getElementById('gesture-name').textContent = '右转！';
                break;
            case ' ':
                state.playerSpeed *= 0.3;
                document.getElementById('detected-gesture').textContent = '✊';
                document.getElementById('gesture-name').textContent = '刹车！';
                break;
        }
    });
    
    // ============ 启动 ============
    initCamera();
    gameLoop();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>涂鸦特工 - 体感版</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Microsoft YaHei', sans-serif; }
        
        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* 开始界面 */
        #start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #start-screen h1 {
            font-size: 48px;
            color: #fff;
            text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
            margin-bottom: 20px;
        }
        #start-screen p {
            color: #aaa;
            font-size: 18px;
            margin: 10px 0;
        }
        #start-btn {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 24px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        #start-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px #00d4ff; }
        
        /* 摄像头预览 */
        #camera-preview {
            width: 320px;
            height: 240px;
            border-radius: 15px;
            border: 3px solid #00d4ff;
            background: #000;
            margin: 20px 0;
            overflow: hidden;
        }
        #camera-preview video { width: 100%; height: 100%; object-fit: cover; }
        #camera-preview canvas { width: 100%; height: 100%; object-fit: cover; }
        
        /* 状态显示 */
        #camera-status {
            color: #0f0;
            font-size: 16px;
            margin-top: 10px;
        }
        
        /* 手势提示 */
        #gesture-guide {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }
        .gesture-item {
            text-align: center;
            color: #fff;
        }
        .gesture-icon { font-size: 48px; }
        .gesture-label { font-size: 14px; color: #aaa; margin-top: 5px; }
        
        /* UI层 */
        #ui-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: none;
        }
        
        /* 迷你地图 */
        #minimap {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #00d4ff;
            border-radius: 10px;
        }
        #minimap canvas { width: 100%; height: 100%; }
        
        /* 状态栏 */
        #status-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
        }
        #status-bar h3 { color: #00d4ff; margin-bottom: 10px; }
        #status-bar p { margin: 5px 0; font-size: 14px; }
        #score-display { font-size: 24px; color: #ff0; }
        
        /* 手势检测区 */
        #gesture-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
            text-align: center;
        }
        #detected-gesture { font-size: 48px; }
        #gesture-name { color: #0f0; margin-top: 5px; }
        
        /* 操作提示 */
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 30px;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
        }
        
        /* 路口提示 */
        #intersection-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,200,0,0.9);
            padding: 10px 30px;
            border-radius: 20px;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- 开始界面 -->
    <div id="start-screen">
        <h1>🎨 涂鸦特工</h1>
        <p>体感版 - 收集所有喷漆罐！</p>
        
        <div id="camera-preview">
            <video id="camera-video" playsinline style="width:1px;height:1px;"></video>
            <canvas id="camera-canvas"></canvas>
            <div id="camera-placeholder" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#666;">
                摄像头加载中...
            </div>
        </div>
        
        <div id="camera-status">📷 正在启动摄像头...</div>
        
        <div id="gesture-guide">
            <div class="gesture-item">
                <div class="gesture-icon">👈</div>
                <div class="gesture-label">向左挥手 = 左转</div>
            </div>
            <div class="gesture-item">
                <div class="gesture-icon">🖐️</div>
                <div class="gesture-label">向上挥手 = 前进</div>
            </div>
            <div class="gesture-item">
                <div class="gesture-icon">👉</div>
                <div class="gesture-label">向右挥手 = 右转</div>
            </div>
            <div class="gesture-item">
                <div class="gesture-icon">✊</div>
                <div class="gesture-label">攥拳 = 刹车</div>
            </div>
        </div>
        
        <button id="start-btn">🎮 开始游戏</button>
        <p style="color:#666;margin-top:15px;font-size:12px;">或者按任意键/点击页面开始</p>
    </div>
    
    <!-- 游戏UI -->
    <div id="ui-layer">
        <canvas id="minimap"></canvas>
        
        <div id="status-bar">
            <h3>📊 状态</h3>
            <p>收集: <span id="score-display">0</span> / <span id="total-cans">0</span></p>
            <p>速度: <span id="speed-display">0</span></p>
            <p>朝向: <span id="direction-display">前</span></p>
        </div>
        
        <div id="gesture-panel">
            <div id="detected-gesture">🖐️</div>
            <div id="gesture-name">等待手势...</div>
        </div>
        
        <div id="controls-hint">
            👈向左挥/向右挥👉 在路口转向 | 🖐️向上挥前进 | ✊攥拳刹车
        </div>
        
        <div id="intersection-hint">⚠️ 岔路口！左挥或右挥转向！</div>
    </div>
    
    <script>
    // ============ 游戏状态 ============
    const state = {
        started: false,
        score: 0,
        playerX: 0,      // 角色世界坐标X
        playerY: 0,      // 角色高度Y
        playerZ: 0,      // 角色世界坐标Z
        playerDir: 0,    // 角色朝向角度（弧度）0=前方向 -Z
        playerSpeed: 0,
        maxSpeed: 8,
        cameraAngle: 0   // 摄像机视角角度
    };
    
    // ============ 道路数据 ============
    // 道路段：{z: 起点Z, length: 长度}
    const roads = [
        { z: 0, length: 200 }
    ];
    
    // 岔路口：{z: 位置, leftX: 左岔路X, rightX: 右岔路X}
    const intersections = [];
    for (let i = 0; i < 10; i++) {
        intersections.push({
            z: -50 - i * 100,
            leftX: -15,
            rightX: 15
        });
    }
    
    // 岔路数据
    const branches = [];
    intersections.forEach(int => {
        // 左岔路
        branches.push({
            startX: int.leftX,
            startZ: int.z,
            endX: int.leftX - 20,
            endZ: int.z - 60,
            isLeft: true
        });
        // 右岔路
        branches.push({
            startX: int.rightX,
            startZ: int.z,
            endX: int.rightX + 20,
            endZ: int.z - 60,
            isLeft: false
        });
    });
    
    // 喷漆罐位置
    const sprayCans = [];
    // 主路上的喷漆罐
    for (let i = 0; i < 15; i++) {
        sprayCans.push({
            x: 0,
            z: -20 - i * 50,
            collected: false,
            color: ['#ff0', '#f0f', '#0ff', '#f00', '#0f0'][i % 5]
        });
    }
    // 岔路上的喷漆罐
    branches.forEach((branch, idx) => {
        sprayCans.push({
            x: (branch.startX + branch.endX) / 2,
            z: (branch.startZ + branch.endZ) / 2,
            collected: false,
            color: ['#ff0', '#f0f', '#0ff', '#f00', '#0f0'][idx % 5],
            isOnBranch: true
        });
    });
    
    // ============ 画布设置 ============
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const minimapCtx = minimapCanvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        minimapCanvas.width = 200;
        minimapCanvas.height = 200;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    // ============ 摄像机控制 ============
    const CAMERA_DISTANCE = 30;  // 摄像机距离角色
    const CAMERA_HEIGHT = 15;     // 摄像机高度
    const CAMERA_SMOOTH = 0.1;    // 摄像机平滑系数
    
    let targetCameraAngle = 0;     // 目标摄像机角度
    
    function updateCamera() {
        // 摄像机始终跟随角色后方
        // 但根据角色朝向可以稍微调整视角
        state.cameraAngle += (targetCameraAngle - state.cameraAngle) * CAMERA_SMOOTH;
    }
    
    function getCameraPosition() {
        // 摄像机在角色后方
        const camX = state.playerX - Math.sin(state.playerDir) * CAMERA_DISTANCE;
        const camY = state.playerY + CAMERA_HEIGHT;
        const camZ = state.playerZ - Math.cos(state.playerDir) * CAMERA_DISTANCE;
        return { x: camX, y: camY, z: camZ };
    }
    
    // ============ 3D投影 ============
    function project(x, y, z) {
        const cam = getCameraPosition();
        
        // 相对摄像机的位置
        const relX = x - cam.x;
        const relY = y - cam.y;
        const relZ = z - cam.z;
        
        // 根据摄像机角度旋转
        const cosA = Math.cos(-state.cameraAngle);
        const sinA = Math.sin(-state.cameraAngle);
        const rotX = relX * cosA - relZ * sinA;
        const rotZ = relX * sinA + relZ * cosA;
        
        // 透视投影
        const fov = 500;
        const scale = fov / (relY + fov);
        
        const screenX = canvas.width / 2 + rotX * scale;
        const screenY = canvas.height / 2 - rotZ * scale;
        
        return { x: screenX, y: screenY, scale: scale };
    }
    
    // ============ 渲染道路 ============
    function drawRoad() {
        // 主路
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 20;
        ctx.beginPath();
        const startProj = project(0, 0, 0);
        const endProj = project(0, 0, -500);
        ctx.moveTo(startProj.x, startProj.y);
        ctx.lineTo(endProj.x, endProj.y);
        ctx.stroke();
        
        // 道路边线
        ctx.strokeStyle = '#00d4ff';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(project(-10, 0, 0).x, project(-10, 0, 0).y);
        ctx.lineTo(project(-10, 0, -500).x, project(-10, 0, -500).y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(project(10, 0, 0).x, project(10, 0, 0).y);
        ctx.lineTo(project(10, 0, -500).x, project(10, 0, -500).y);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // 绘制岔路
        branches.forEach(branch => {
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 15;
            ctx.beginPath();
            const s = project(branch.startX, 0, branch.startZ);
            const e = project(branch.endX, 0, branch.endZ);
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(e.x, e.y);
            ctx.stroke();
            
            // 岔路标线
            ctx.strokeStyle = '#f80';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(e.x, e.y);
            ctx.stroke();
            ctx.setLineDash([]);
        });
    }
    
    // ============ 渲染喷漆罐 ============
    function drawSprayCans() {
        sprayCans.forEach(can => {
            if (can.collected) return;
            
            const proj = project(can.x, 2, can.z);
            const size = Math.max(5, 30 * proj.scale);
            
            // 喷漆罐
            ctx.fillStyle = can.color;
            ctx.beginPath();
            ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
            ctx.fill();
            
            // 发光效果
            ctx.shadowColor = can.color;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(proj.x, proj.y, size * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });
    }
    
    // ============ 渲染角色 ============
    function drawPlayer() {
        const proj = project(state.playerX, 2, state.playerZ);
        const size = Math.max(10, 40 * proj.scale);
        
        // 角色身体
        ctx.fillStyle = '#00ff88';
        ctx.beginPath();
        ctx.arc(proj.x, proj.y - size, size, 0, Math.PI * 2);
        ctx.fill();
        
        // 方向指示
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        const dirX = state.playerX + Math.sin(state.playerDir) * 5;
        const dirZ = state.playerZ + Math.cos(state.playerDir) * 5;
        const dirProj = project(dirX, 2, dirZ);
        ctx.beginPath();
        ctx.moveTo(proj.x, proj.y - size);
        ctx.lineTo(dirProj.x, dirProj.y - size * proj.scale / proj.scale);
        ctx.stroke();
        
        // 玩家名称
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('你', proj.x, proj.y - size * 2);
    }
    
    // ============ 绘制迷你地图 ============
    function drawMinimap() {
        minimapCtx.fillStyle = 'rgba(0,0,0,0.8)';
        minimapCtx.fillRect(0, 0, 200, 200);
        
        const scale = 1.5;
        const centerX = 100;
        const centerY = 100;
        
        // 绘制主路
        minimapCtx.strokeStyle = '#444';
        minimapCtx.lineWidth = 10;
        minimapCtx.beginPath();
        minimapCtx.moveTo(centerX, centerY);
        minimapCtx.lineTo(centerX, 0);
        minimapCtx.stroke();
        
        // 绘制岔路
        branches.forEach(branch => {
            minimapCtx.strokeStyle = '#f80';
            minimapCtx.lineWidth = 5;
            minimapCtx.beginPath();
            const sx = centerX + (branch.startX) * scale;
            const sy = centerY + (branch.startZ - state.playerZ) * scale;
            const ex = centerX + (branch.endX) * scale;
            const ey = centerY + (branch.endZ - state.playerZ) * scale;
            minimapCtx.moveTo(sx, sy);
            minimapCtx.lineTo(ex, ey);
            minimapCtx.stroke();
        });
        
        // 绘制喷漆罐
        sprayCans.forEach(can => {
            if (can.collected) return;
            const canX = centerX + (can.x - state.playerX) * scale;
            const canY = centerY + (can.z - state.playerZ) * scale;
            if (canX < 0 || canX > 200 || canY < 0 || canY > 200) return;
            
            minimapCtx.fillStyle = can.color;
            minimapCtx.beginPath();
            minimapCtx.arc(canX, canY, 4, 0, Math.PI * 2);
            minimapCtx.fill();
        });
        
        // 绘制玩家
        minimapCtx.fillStyle = '#0f0';
        minimapCtx.beginPath();
        minimapCtx.arc(centerX, centerY, 6, 0, Math.PI * 2);
        minimapCtx.fill();
        
        // 方向箭头
        const arrowLen = 15;
        const arrowX = centerX + Math.sin(state.playerDir) * arrowLen;
        const arrowY = centerY + Math.cos(state.playerDir) * arrowLen;
        minimapCtx.strokeStyle = '#fff';
        minimapCtx.lineWidth = 2;
        minimapCtx.beginPath();
        minimapCtx.moveTo(centerX, centerY);
        minimapCtx.lineTo(arrowX, arrowY);
        minimapCtx.stroke();
    }
    
    // ============ 碰撞检测 ============
    function checkCollisions() {
        sprayCans.forEach(can => {
            if (can.collected) return;
            const dx = can.x - state.playerX;
            const dz = can.z - state.playerZ;
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist < 5) {
                can.collected = true;
                state.score++;
                updateUI();
            }
        });
    }
    
    // ============ 更新UI ============
    function updateUI() {
        document.getElementById('score-display').textContent = state.score;
        document.getElementById('total-cans').textContent = sprayCans.length;
        document.getElementById('speed-display').textContent = state.playerSpeed.toFixed(1);
        
        // 朝向
        let dirText = '前';
        const deg = ((state.playerDir * 180 / Math.PI) % 360 + 360) % 360;
        if (deg > 45 && deg <= 135) dirText = '右';
        else if (deg > 135 && deg <= 225) dirText = '后';
        else if (deg > 225 && deg <= 315) dirText = '左';
        document.getElementById('direction-display').textContent = dirText;
        
        // 岔路口提示
        const nearIntersection = intersections.find(int => Math.abs(state.playerZ - int.z) < 15);
        document.getElementById('intersection-hint').style.display = nearIntersection ? 'block' : 'none';
    }
    
    // ============ 游戏主循环 ============
    function gameLoop() {
        if (!state.started) {
            requestAnimationFrame(gameLoop);
            return;
        }
        
        // 更新位置
        state.playerX += Math.sin(state.playerDir) * state.playerSpeed;
        state.playerZ += Math.cos(state.playerDir) * state.playerSpeed;
        
        // 更新摄像机
        updateCamera();
        
        // 碰撞检测
        checkCollisions();
        
        // 渲染
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        drawRoad();
        drawSprayCans();
        drawPlayer();
        drawMinimap();
        updateUI();
        
        requestAnimationFrame(gameLoop);
    }
    
    // ============ 体感控制 ============
    let handLandmarks = null;
    let gestureCooldown = 0;
    let waveCount = 0;
    let lastWaveTime = 0;
    const WAVE_COOLDOWN = 30; // 帧冷却
    const WAVE_THRESHOLD = 0.15; // 手势变化阈值
    const WAVE_COUNT_NEEDED = 2; // 开始游戏需要的挥手次数
    
    function detectGesture(landmarks) {
        if (gestureCooldown > 0) {
            gestureCooldown--;
            return null;
        }
        
        // 获取关键点
        const wrist = landmarks[0];
        const thumb = landmarks[4];
        const index = landmarks[8];
        const middle = landmarks[12];
        const ring = landmarks[16];
        const pinky = landmarks[20];
        
        // 计算手的位置
        const handY = wrist.y;
        const handX = wrist.x;
        
        // 计算手指张开程度
        const fingerSpread = Math.abs(index.x - pinky.x);
        const thumbIndexDist = Math.sqrt(
            Math.pow(thumb.x - index.x, 2) + Math.pow(thumb.y - index.y, 2)
        );
        
        // 攥拳检测：所有手指弯曲
        const isFist = thumbIndexDist < 0.05 && 
                      Math.abs(index.y - wrist.y) > 0.1 &&
                      Math.abs(middle.y - wrist.y) > 0.1;
        
        // 向前挥手检测（手向上移动）
        const isWaveUp = handY < 0.5;
        
        // 左右挥手检测
        const isWaveLeft = handX < 0.4;
        const isWaveRight = handX > 0.6;
        
        // 检测手势变化
        if (isFist) return 'fist';
        if (isWaveUp) return 'wave_up';
        if (isWaveLeft) return 'wave_left';
        if (isWaveRight) return 'wave_right';
        
        return null;
    }
    
    function handleGesture(gesture) {
        // 更新手势显示
        const gestureIcon = document.getElementById('detected-gesture');
        const gestureName = document.getElementById('gesture-name');
        
        switch(gesture) {
            case 'wave_left':
                gestureIcon.textContent = '👈';
                gestureName.textContent = '向左转！';
                // 角色左转
                if (state.started) {
                    state.playerDir -= Math.PI / 6; // 左转30度
                }
                break;
            case 'wave_right':
                gestureIcon.textContent = '👉';
                gestureName.textContent = '向右转！';
                // 角色右转
                if (state.started) {
                    state.playerDir += Math.PI / 6; // 右转30度
                }
                break;
            case 'wave_up':
                gestureIcon.textContent = '🖐️';
                gestureName.textContent = '前进！';
                // 加速
                if (state.started) {
                    state.playerSpeed = Math.min(state.maxSpeed, state.playerSpeed + 2);
                }
                break;
            case 'fist':
                gestureIcon.textContent = '✊';
                gestureName.textContent = '刹车！';
                // 刹车
                if (state.started) {
                    state.playerSpeed *= 0.3;
                }
                break;
            default:
                gestureIcon.textContent = '🖐️';
                gestureName.textContent = '等待手势...';
        }
        
        gestureCooldown = WAVE_COOLDOWN;
    }
    
    // ============ 摄像头初始化 ============
    async function initCamera() {
        const videoElement = document.getElementById('camera-video');
        const canvasElement = document.getElementById('camera-canvas');
        const placeholder = document.getElementById('camera-placeholder');
        const statusEl = document.getElementById('camera-status');
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 640, height: 480 } 
            });
            videoElement.srcObject = stream;
            await videoElement.play();
            
            placeholder.style.display = 'none';
            statusEl.textContent = '✅ 摄像头已启动 - 挥动手开始游戏';
            statusEl.style.color = '#0f0';
            
            // 初始化MediaPipe Hands
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
            });
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            
            hands.onResults((results) => {
                // 绘制摄像头画面
                const ctx = canvasElement.getContext('2d');
                canvasElement.width = videoElement.videoWidth || 320;
                canvasElement.height = videoElement.videoHeight || 240;
                ctx.save();
                ctx.transform(-1, 0, 0, 1, canvasElement.width, 0);
                ctx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                ctx.restore();
                
                // 绘制手部检测框
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    
                    ctx.strokeStyle = '#00d4ff';
                    ctx.lineWidth = 2;
                    landmarks.forEach((landmark, i) => {
                        const x = landmark.x * canvasElement.width;
                        const y = landmark.y * canvasElement.height;
                        ctx.beginPath();
                        ctx.arc(x, y, 4, 0, Math.PI * 2);
                        ctx.stroke();
                    });
                    
                    handLandmarks = landmarks;
                    
                    // 检测手势
                    const gesture = detectGesture(landmarks);
                    
                    if (!state.started) {
                        // 游戏未开始，检测挥手启动
                        if (gesture === 'wave_up') {
                            const now = Date.now();
                            if (now - lastWaveTime > 500) {
                                waveCount++;
                                lastWaveTime = now;
                                statusEl.textContent = `📷 挥动 ${waveCount}/${WAVE_COUNT_NEEDED} 次开始游戏`;
                                
                                if (waveCount >= WAVE_COUNT_NEEDED) {
                                    startGame();
                                }
                            }
                        }
                    } else {
                        // 游戏进行中，处理手势
                        handleGesture(gesture);
                    }
                } else {
                    handLandmarks = null;
                }
            });
            
            // 持续处理视频帧
            const processFrame = async () => {
                if (videoElement.readyState >= 2) {
                    await hands.send({ image: videoElement });
                }
                requestAnimationFrame(processFrame);
            };
            processFrame();
            
        } catch (err) {
            console.error('摄像头错误:', err);
            statusEl.textContent = '❌ 摄像头启动失败: ' + err.message;
            statusEl.style.color = '#f00';
        }
    }
    
    // ============ 开始游戏 ============
    function startGame() {
        if (state.started) return;
        state.started = true;
        state.playerSpeed = 3;
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'block';
        
        updateUI();
    }
    
    // ============ 事件绑定 ============
    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('start-screen').onclick = (e) => {
        if (e.target.id !== 'start-btn') startGame();
    };
    
    document.addEventListener('keydown', (e) => {
        if (!state.started) {
            startGame();
            return;
        }
        
        switch(e.key.toLowerCase()) {
            case 'w':
            case 'arrowup':
                state.playerSpeed = Math.min(state.maxSpeed, state.playerSpeed + 2);
                document.getElementById('detected-gesture').textContent = '🖐️';
                document.getElementById('gesture-name').textContent = '前进！';
                break;
            case 'a':
            case 'arrowleft':
                state.playerDir -= Math.PI / 6;
                document.getElementById('detected-gesture').textContent = '👈';
                document.getElementById('gesture-name').textContent = '左转！';
                break;
            case 'd':
            case 'arrowright':
                state.playerDir += Math.PI / 6;
                document.getElementById('detected-gesture').textContent = '👉';
                document.getElementById('gesture-name').textContent = '右转！';
                break;
            case ' ':
                state.playerSpeed *= 0.3;
                document.getElementById('detected-gesture').textContent = '✊';
                document.getElementById('gesture-name').textContent = '刹车！';
                break;
        }
    });
    
    // ============ 启动 ============
    initCamera();
    gameLoop();
    </script>
</body>
</html>

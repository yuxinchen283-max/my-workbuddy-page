<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15171c;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}

@media(max-width:720px){#ui{font-size:12px;max-width:calc(100vw - 28px)}#controls{top:auto;bottom:68px;right:10px}#centerMessage{font-size:17px;top:24%}#hintBottom{width:calc(100vw - 36px);font-size:12px}#miniMap{width:160px;height:220px;top:120px}#mapTitle{top:130px;right:26px}#cameraVideo,#skeletonCanvas{width:170px;height:128px}}

<body>
<div id="app">
<video id="cameraVideo" autoplay playsinline muted></video>
<canvas id="skeletonCanvas" width="240" height="180"></canvas>
<canvas id="hiddenCanvas" width="160" height="120"></canvas>
<div id="threeLayer"></div>
<canvas id="fallbackCanvas"></canvas>

<div id="ui">
  <div class="row"><strong>🎨 涂鸦特工 · 街道版 v5</strong></div>
  <div class="row">
    <span class="pill">状态：<span id="stateText">初始化</span></span>
    <span class="pill">输入：<span id="inputMode">初始化</span></span>
    <span class="pill" id="camStablePill" style="display:none">体感：<span id="camStable" style="color:#ff9800">等待中</span></span>
  </div>
  <div class="row">
    <span class="pill">携带颜色：<span id="carriedDot" class="color-dot"></span><span id="carriedText">无</span></span>
    <span class="pill">目标区域：<span id="targetDot" class="color-dot"></span><span id="targetText">-</span></span>
  </div>
  <div class="row">
    <span>涂色进度</span>

  </div>
  <div id="tipText" style="color:#aab;font-size:12px;margin-top:4px">体感：向左挥手左转，向右挥手右转，向上挥手加速，握拳停止 | 键鼠：A/D转向，W加速，S/空格停止，J喷涂</div>
</div>

<div id="scoreBoard">
  <span>🎨 <span id="paintedCount">0</span>/<span id="totalZones">0</span> 区块</span>

</div>

<div id="controls">
  <button id="btnCamStart">📷 摄像头</button>
  <button id="btnCamStop">停止摄像头</button>
  <button id="btnReinit">🔄 重试检测</button>

  <button id="btnReset">重置 R</button>
</div>

<canvas id="miniMap" width="240" height="300"></canvas>
<div id="mapTitle">🗺 街道地图</div>
<div id="centerMessage">准备滑行！输入方向开始运动</div>
<div id="hintBottom">体感：左手向左挥=左转 右手向右挥=右转 向上挥=加速 握拳=停止 | 键鼠：A/D转向 W加速 S/空格停止 J喷涂</div>
<div id="debugPanel"></div>
<div id="errorBox"></div>
</div>

<script>
// ============================================================
// 参数配置
// ============================================================
const PARAMS = {
  moveSpeed: 4.2,
  boostSpeed: 5.8,
  laneWidth: 3.4,
  paintDuration: 2.5,
  collectRadius: 1.5,
  cameraLostFallback: 2
};

const COLORS = {
  none:   0xbfc4c9,
  red:    0xff4141,
  yellow: 0xffdf3d,
  blue:   0x36a3ff,
  green:  0x49ff88,
  pink:   0xff4fd8,
  cyan:   0x00e5ff,
  orange: 0xff8c00,
  road:   0x555a63,
  roadDark: 0x333840,
  sidewalk: 0x8a8e96
};

const COLOR_NAMES = { none:"无", red:"红", yellow:"黄", blue:"蓝", green:"绿", orange:"橙" };
const PAINT_COLORS = ['red','yellow','blue','green','orange'];

// ============================================================
// 路网定义
// ============================================================
// 路口检测距离（提前多少开始识别手势）
const TURN_AHEAD_DISTANCE = 6.0; // 单位：格子距离

const GRID_W = 12;
const GRID_H = 14;

const gridNodes = [];
for (let row = 0; row <= 4; row++) {
  for (let col = 0; col <= 6; col++) {
    gridNodes.push({
      id: row * 7 + col,
      col, row,
      x: (col - 3) * GRID_W,
      z: (row - 4) * GRID_H + 12
    });
  }
}

function nodeId(col, row) { return row * 7 + col; }
function getNode(col, row) { return gridNodes[nodeId(col, row)]; }

const roadSegments = [];
for (let row = 0; row <= 4; row++) {
  for (let col = 0; col < 6; col++) {
    roadSegments.push({ id: `h_${col}_${row}`, fromNode: nodeId(col, row), toNode: nodeId(col+1, row), open: true, paintColor: null, paintProgress: 0 });
  }
}
for (let row = 0; row < 4; row++) {
  for (let col = 0; col <= 6; col++) {
    roadSegments.push({ id: `v_${col}_${row}`, fromNode: nodeId(col, row), toNode: nodeId(col, row+1), open: true, paintColor: null, paintProgress: 0 });
  }
}

const blocks = [];
for (let row = 0; row < 4; row++) {
  for (let col = 0; col < 6; col++) {
    blocks.push({
      id: `block_${col}_${row}`,
      col, row,
      cx: ((col - 3) * GRID_W) + GRID_W/2,
      cz: ((row - 4) * GRID_H + 12) + GRID_H/2 - GRID_H,
      painted: false,
      targetColor: PAINT_COLORS[(col + row * 2) % PAINT_COLORS.length]
    });
  }
}

const canDefs = [];
const canColorCycle = ['red','yellow','blue','green','orange','red','yellow','blue','green','orange','red','yellow'];
let canIdx = 0;
[[1,2],[2,1],[4,2],[5,3],[3,0],[0,3],[6,1],[3,3],[1,0],[5,1],[2,3],[4,0]].forEach(([col,row]) => {
  const n = getNode(col, row);
  canDefs.push({ id: `can_${col}_${row}`, x: n.x, z: n.z, y: 1.2, colorType: canColorCycle[canIdx++], collected: false, radius: 1.5 });
});

// ============================================================
// 摄像头识别 - TensorFlow.js MoveNet 实时骨骼追踪
// ============================================================
(function(){
  let video = null, sk = null, skctx = null;
  let stream = null;
  let frameLoopId = null;
  let confirmedDir = 0;
  let lastDirChangeAt = 0;
  let lastWaveAt = 0;
  const DIR_CHANGE_MIN_MS = 400;
  const WAVE_SUSTAIN_MS = 600;
  let logCounter = 0;

  // MoveNet 检测器
  let detector = null;
  let detectorReady = false;
  let modelLoading = false;

  // 骨骼状态：正常=绿色，异常=红色
  let boneStatus = 'normal';

  const state = {
    enabled: false,
    ready: false,
    hasCamera: false,
    confidence: 0,
    message: '',
    bodyCenter: { x: 0.5, y: 0.5 },
    action: {
      horizontalIntent: 0,
      forwardBoostIntent: false,
      brakeHold: false,
      paintActive: false,
      waveUpTrigger: false,
      brakeTrigger: false
    },
    raw: { motionAmount: 0, leftHandUp: false, rightHandUp: false },
    // 新增：路口预判状态
    nearIntersection: false,
    turnHint: ''  // 'left' | 'right' | ''
  };

  // MoveNet 关键点索引 (17点，索引0-16)
  const KEYPOINT = {
    NOSE: 0,
    LEFT_EYE: 1, RIGHT_EYE: 2,
    LEFT_EAR: 3, RIGHT_EAR: 4,
    LEFT_SHOULDER: 5, RIGHT_SHOULDER: 6,
    LEFT_ELBOW: 7, RIGHT_ELBOW: 8,
    LEFT_WRIST: 9, RIGHT_WRIST: 10,
    LEFT_HIP: 11, RIGHT_HIP: 12,
    LEFT_KNEE: 13, RIGHT_KNEE: 14,
    LEFT_ANKLE: 15, RIGHT_ANKLE: 16
  };

  // MoveNet 骨骼连接 (使用正确的 0-16 索引)
  const CONNECTIONS = [
    [5, 7], [7, 9],   // 左臂：肩→肘→腕
    [6, 8], [8, 10],  // 右臂
    [5, 6],             // 肩膀连接
    [5, 11], [6, 12], // 肩膀到髋部
    [11, 12],           // 髋部连接
    [11, 13], [13, 15], // 左腿：髋→膝→踝
    [12, 14], [14, 16]  // 右腿
  ];

  // 状态追踪
  let prevLeftWrist = null, prevRightWrist = null;
  let prevLeftWristTime = 0, prevRightWristTime = 0;
  let prevLeftHandUp = false, prevRightHandUp = false;
  let prevBothHandsDown = false;
  let lastWaveTime = 0;

  // 检查 TensorFlow.js 和 MoveNet 是否加载
  function isDetectorReady() {
    return !!(window.tf && window.poseDetection && detectorReady);
  }

  // 初始化 MoveNet 检测器
  async function initDetector() {
    if (detector || modelLoading) return;
    modelLoading = true;

    try {
      console.log('[MoveNet] 加载中...');

      // 等待 TensorFlow.js 就绪
      await tf.ready();

      // 创建 MoveNet 检测器
      const model = poseDetection.SupportedModels.MoveNet;
      const detectorConfig = {
        modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
        enableSmoothing: true,
        minPoseScore: 0.15
      };

      detector = await poseDetection.createDetector(model, detectorConfig);
      detectorReady = true;
      modelLoading = false;
      console.log('[MoveNet] 加载完成!');

    } catch (e) {
      console.error('[MoveNet] 加载失败:', e);
      modelLoading = false;
      detectorReady = false;
    }
  }

  // 判断手腕是否上举（高于肩膀）
  function isHandUp(landmarks) {
    const leftShoulder = landmarks[KEYPOINT.LEFT_SHOULDER];
    const rightShoulder = landmarks[KEYPOINT.RIGHT_SHOULDER];
    const leftWrist = landmarks[KEYPOINT.LEFT_WRIST];
    const rightWrist = landmarks[KEYPOINT.RIGHT_WRIST];

    let leftUp = false, rightUp = false;

    if (leftShoulder && leftWrist && leftShoulder.score > 0.3 && leftWrist.score > 0.3) {
      // y 值越小表示越高
      leftUp = leftWrist.y < leftShoulder.y - 0.08;
    }
    if (rightShoulder && rightWrist && rightShoulder.score > 0.3 && rightWrist.score > 0.3) {
      rightUp = rightWrist.y < rightShoulder.y - 0.08;
    }

    return { leftUp, rightUp };
  }

  // 检测握拳（手腕靠近肘部）
  function isFist(landmarks) {
    const leftElbow = landmarks[KEYPOINT.LEFT_ELBOW];
    const leftWrist = landmarks[KEYPOINT.LEFT_WRIST];
    const rightElbow = landmarks[KEYPOINT.RIGHT_ELBOW];
    const rightWrist = landmarks[KEYPOINT.RIGHT_WRIST];

    let leftFist = false, rightFist = false;

    if (leftElbow && leftWrist && leftElbow.score > 0.3 && leftWrist.score > 0.3) {
      const dist = Math.hypot(leftWrist.x - leftElbow.x, leftWrist.y - leftElbow.y);
      leftFist = dist < 0.15;
    }
    if (rightElbow && rightWrist && rightElbow.score > 0.3 && rightWrist.score > 0.3) {
      const dist = Math.hypot(rightWrist.x - rightElbow.x, rightWrist.y - rightElbow.y);
      rightFist = dist < 0.15;
    }

    return leftFist || rightFist;
  }

  // 动态挥手检测的历史记录
  let leftWaveHistory = [];  // [{time, dx}]
  let rightWaveHistory = [];
  let lastLeftWaveTrigger = 0;
  let lastRightWaveTrigger = 0;
  const WAVE_COOLDOWN_MS = 600;  // 挥手触发冷却时间

  // 判断是否接近路口
  function checkIntersectionProximity() {
    try {
      const p = Game ? Game.player : null;
      if (!p || !p.currentSegment) return false;

      const seg = p.currentSegment;
      const nA = gridNodes[seg.fromNode];
      const nB = gridNodes[seg.toNode];
      const len = Math.hypot(nB.x - nA.x, nB.z - nA.z);

      const t = p.segT;
      const distToEnd = p.segDir > 0 ? (1 - t) * len : t * len;

      return distToEnd < TURN_AHEAD_DISTANCE;
    } catch(e) {
      return false;
    }
  }

  // 检测动态挥手动作（大幅改进版）
  function detectDynamicWave(landmarks, now) {
    const lw = landmarks[KEYPOINT.LEFT_WRIST];
    const rw = landmarks[KEYPOINT.RIGHT_WRIST];
    const ls = landmarks[KEYPOINT.LEFT_SHOULDER];
    const rs = landmarks[KEYPOINT.RIGHT_SHOULDER];

    if (!lw || !rw || !ls || !rs) return { left: false, right: false, leftUp: false, rightUp: false };

    const dt = (now - prevLeftWristTime) / 1000;
    const dtR = (now - prevRightWristTime) / 1000;

    // 计算手腕速度
    let leftVelX = 0, leftVelY = 0;
    let rightVelX = 0, rightVelY = 0;

    if (prevLeftWrist && lw && lw.score > 0.3 && dt > 0.01 && dt < 0.5) {
      leftVelX = (lw.x - prevLeftWrist.x) / dt;
      leftVelY = (lw.y - prevLeftWrist.y) / dt;
    }
    if (prevRightWrist && rw && rw.score > 0.3 && dtR > 0.01 && dtR < 0.5) {
      rightVelX = (rw.x - prevRightWrist.x) / dtR;
      rightVelY = (rw.y - prevRightWrist.y) / dtR;
    }

    // 向左挥手检测：左手向左快速移动（速度 < -0.5）
    const leftWave = leftVelX < -0.6 && Math.abs(leftVelY) < 0.5;

    // 向右挥手检测：右手向右快速移动（速度 > 0.6）
    const rightWave = rightVelX > 0.6 && Math.abs(rightVelY) < 0.5;

    // 向上挥手检测：手腕向上快速移动（速度 < -0.4）
    const leftUpWave = leftVelY < -0.4;
    const rightUpWave = rightVelY < -0.4;

    // 添加到历史记录
    if (leftWave || leftUpWave) {
      leftWaveHistory.push({ time: now, velX: leftVelX, velY: leftVelY });
    }
    if (rightWave || rightUpWave) {
      rightWaveHistory.push({ time: now, velX: rightVelX, velY: rightVelY });
    }

    // 清理过期记录
    const minTime = now - 1000;
    leftWaveHistory = leftWaveHistory.filter(h => h.time > minTime);
    rightWaveHistory = rightWaveHistory.filter(h => h.time > minTime);

    // 检查是否可以触发（最近300ms内是否有明显的挥手）
    const recentLeft = leftWaveHistory.filter(h => now - h.time < 300);
    const recentRight = rightWaveHistory.filter(h => now - h.time < 300);

    const leftStrong = recentLeft.length >= 1 && recentLeft.some(h => h.velX < -0.7 || h.velY < -0.5);
    const rightStrong = recentRight.length >= 1 && recentRight.some(h => h.velX > 0.7 || h.velY < -0.5);

    // 冷却检查
    const leftCanTrigger = leftStrong && (now - lastLeftWaveTrigger) > WAVE_COOLDOWN_MS;
    const rightCanTrigger = rightStrong && (now - lastRightWaveTrigger) > WAVE_COOLDOWN_MS;

    if (leftCanTrigger) lastLeftWaveTrigger = now;
    if (rightCanTrigger) lastRightWaveTrigger = now;

    return {
      left: leftCanTrigger,
      right: rightCanTrigger,
      leftUp: leftUpWave && (now - lastLeftWaveTrigger) > WAVE_COOLDOWN_MS && leftVelY < -0.6,
      rightUp: rightUpWave && (now - lastRightWaveTrigger) > WAVE_COOLDOWN_MS && rightVelY < -0.6
    };
  }

  // 处理骨骼数据
  function processLandmarks(landmarks) {
    if (!landmarks || !landmarks.length) return null;

    const now = performance.now();

    // 计算身体中心
    let bodyCenterX = 0, bodyCenterY = 0, count = 0;
    [KEYPOINT.LEFT_SHOULDER, KEYPOINT.RIGHT_SHOULDER].forEach(i => {
      if (landmarks[i] && landmarks[i].score > 0.3) {
        bodyCenterX += landmarks[i].x;
        bodyCenterY += landmarks[i].y;
        count++;
      }
    });
    if (count > 0) {
      bodyCenterX /= count;
      bodyCenterY /= count;
    }
    state.bodyCenter = { x: bodyCenterX, y: bodyCenterY };

    // 计算置信度
    let validCount = 0;
    const keyIndices = [0, 11, 12, 13, 14, 15, 16, 23, 24];
    keyIndices.forEach(i => {
      if (landmarks[i] && landmarks[i].score > 0.3) validCount++;
    });
    state.confidence = validCount / keyIndices.length;

    // 方向检测（优先使用动态挥手）
    const ls = landmarks[KEYPOINT.LEFT_SHOULDER];
    const rs = landmarks[KEYPOINT.RIGHT_SHOULDER];
    const lw = landmarks[KEYPOINT.LEFT_WRIST];
    const rw = landmarks[KEYPOINT.RIGHT_WRIST];

    // 更新手腕历史位置（必须在检测之前）
    if (lw && lw.score > 0.3) {
      prevLeftWrist = { x: lw.x, y: lw.y };
      prevLeftWristTime = now;
    }
    if (rw && rw.score > 0.3) {
      prevRightWrist = { x: rw.x, y: rw.y };
      prevRightWristTime = now;
    }

    // 动态挥手检测
    const waves = detectDynamicWave(landmarks, now);

    // 调试日志（每30帧输出一次骨骼数据）
    if (logCounter % 30 === 0) {
      const lw = landmarks[KEYPOINT.LEFT_WRIST];
      const rw = landmarks[KEYPOINT.RIGHT_WRIST];
      const ls = landmarks[KEYPOINT.LEFT_SHOULDER];
      const rs = landmarks[KEYPOINT.RIGHT_SHOULDER];

      const dt = (now - prevLeftWristTime) / 1000;
      const dtR = (now - prevRightWristTime) / 1000;
      let leftVelX = 0, leftVelY = 0, rightVelX = 0, rightVelY = 0;
      if (prevLeftWrist && lw && lw.score > 0.3 && dt > 0.01 && dt < 0.5) {
        leftVelX = (lw.x - prevLeftWrist.x) / dt;
        leftVelY = (lw.y - prevLeftWrist.y) / dt;
      }
      if (prevRightWrist && rw && rw.score > 0.3 && dtR > 0.01 && dtR < 0.5) {
        rightVelX = (rw.x - prevRightWrist.x) / dtR;
        rightVelY = (rw.y - prevRightWrist.y) / dtR;
      }

      console.log('[骨骼数据]',
        '| 左手腕:', lw && lw.score > 0.3 ? `(${lw.x.toFixed(2)}, ${lw.y.toFixed(2)})` : '未检测',
        '| 右手腕:', rw && rw.score > 0.3 ? `(${rw.x.toFixed(2)}, ${rw.y.toFixed(2)})` : '未检测',
        '| 左肩:', ls ? `(${ls.x.toFixed(2)}, ${ls.y.toFixed(2)})` : '-',
        '| 右肩:', rs ? `(${rs.x.toFixed(2)}, ${rs.y.toFixed(2)})` : '-',
        '| 左手速度:', `(${leftVelX.toFixed(2)}, ${leftVelY.toFixed(2)})`,
        '| 右手速度:', `(${rightVelX.toFixed(2)}, ${rightVelY.toFixed(2)})`,
        '| 挥手历史:', leftWaveHistory.length, '/', rightWaveHistory.length,
        '| 方向:', rawDir, '| 路口:', state.nearIntersection ? '接近!' : '-');
    }

    // 手势状态
    state.raw.leftHandUp = waves.left || waves.leftUp;
    state.raw.rightHandUp = waves.right || waves.rightUp;

    // 路口预判状态
    state.nearIntersection = checkIntersectionProximity();

    let rawDir = 0;

    // 优先使用动态挥手检测
    if (waves.left) {
      rawDir = -1;
      state.turnHint = 'left';
      console.log('[MoveNet] 检测到向左挥手！');
    } else if (waves.right) {
      rawDir = 1;
      state.turnHint = 'right';
      console.log('[MoveNet] 检测到向右挥手！');
    } else {
      state.turnHint = '';
    }

    // 向上挥手触发加速
    const upwardWave = waves.leftUp || waves.rightUp;
    const waveUpRising = upwardWave && !(prevLeftHandUp || prevRightHandUp);
    state.action.waveUpTrigger = waveUpRising;
    if (waveUpRising) {
      lastWaveTime = now;
      console.log('[MoveNet] 向上挥手 - 加速！');
    }
    prevLeftHandUp = state.raw.leftHandUp;
    prevRightHandUp = state.raw.rightHandUp;

    // 前进状态（向上挥后加速持续）
    const boostLatch = now - lastWaveTime < WAVE_SUSTAIN_MS;
    state.action.forwardBoostIntent = boostLatch;

    // 握拳检测
    const bothHandsDown = isFist(landmarks);
    const brakeRising = bothHandsDown && !prevBothHandsDown;
    state.action.brakeTrigger = brakeRising;
    prevBothHandsDown = bothHandsDown;
    state.action.brakeHold = bothHandsDown;

    // 只有在接近路口时才使用方向输入
    if (state.nearIntersection || rawDir !== 0) {
      state.action.horizontalIntent = rawDir;
    } else {
      state.action.horizontalIntent = 0;
    }

    return landmarks;
  }

  // 绘制小窗骨骼
  function drawSkeleton(landmarks, confidence) {
    if (!skctx) return;
    const w = 240, h = 180;

    // 先画深色背景，确保文字始终可见
    skctx.fillStyle = '#1a1d24';
    skctx.fillRect(0, 0, w, h);

    // 把摄像头画面绘制到骨架画布作为背景（叠加）
    if (video && video.readyState >= 2) {
      skctx.save();
      skctx.translate(w, 0);
      skctx.scale(-1, 1); // 镜像翻转
      skctx.drawImage(video, 0, 0, w, h);
      skctx.restore();
    }

    // 画布边框
    const borderColor = boneStatus === 'normal' ? 'rgba(0, 255, 136, 0.6)' : 'rgba(255, 68, 68, 0.5)';
    skctx.strokeStyle = borderColor;
    skctx.lineWidth = 2;
    skctx.strokeRect(1, 1, 238, 178);

    if (!landmarks || !landmarks.length) {
      skctx.fillStyle = boneStatus === 'normal' ? '#00ff88' : '#ff4444';
      skctx.font = 'bold 11px sans-serif';
      skctx.textAlign = 'center';
      skctx.fillText('等待人体检测...', 120, 50);
      skctx.fillStyle = '#888';
      skctx.font = '10px sans-serif';
      skctx.fillText('请站到摄像头前', 120, 66);
      // 不 return，继续显示实时数据
    } else {
      const scaleX = (x) => (1 - x) * w;
      const scaleY = (y) => y * h;

      skctx.save();
      skctx.strokeStyle = boneStatus === 'normal' ? '#00ff88' : '#ff4444';
      skctx.fillStyle = boneStatus === 'normal' ? '#00ff88' : '#ff4444';
      skctx.lineWidth = 2;

      // 连接线
      CONNECTIONS.forEach(([a, b]) => {
        const la = landmarks[a], lb = landmarks[b];
        if (la && lb && la.score > 0.3 && lb.score > 0.3) {
          skctx.beginPath();
          skctx.moveTo(scaleX(la.x), scaleY(la.y));
          skctx.lineTo(scaleX(lb.x), scaleY(lb.y));
          skctx.stroke();
        }
      });

      // 关节点
      Object.values(KEYPOINT).forEach(i => {
        const p = landmarks[i];
        if (!p || p.score < 0.3) return;
        const x = scaleX(p.x);
        const y = scaleY(p.y);
        const radius = (i === KEYPOINT.NOSE) ? 5 : 3;
        skctx.beginPath();
        skctx.arc(x, y, radius, 0, Math.PI * 2);
        skctx.fill();
      });

      // 手腕特殊标记
      [KEYPOINT.LEFT_WRIST, KEYPOINT.RIGHT_WRIST].forEach(i => {
        const p = landmarks[i];
        if (!p || p.score < 0.3) return;
        const x = scaleX(p.x);
        const y = scaleY(p.y);
        const isUp = (i === KEYPOINT.LEFT_WRIST && state.raw.leftHandUp) ||
                     (i === KEYPOINT.RIGHT_WRIST && state.raw.rightHandUp);
        skctx.fillStyle = isUp ? '#ffeb3b' : '#fff176';
        skctx.beginPath();
        skctx.arc(x, y, 4, 0, Math.PI * 2);
        skctx.fill();
      });

      // 方向指示
      if (confirmedDir !== 0) {
        skctx.font = 'bold 16px sans-serif';
        skctx.fillStyle = confirmedDir < 0 ? '#ff5252' : '#36a3ff';
        skctx.fillText(confirmedDir < 0 ? '◀' : '▶', 210, 25);
      }

      // 路口预判提示
      if (state.nearIntersection) {
        skctx.font = 'bold 11px sans-serif';
        skctx.fillStyle = '#ff9800';
        skctx.fillText('接近路口!', 6, 26);
      }

      skctx.restore();
    }

    // 状态标签和置信度
    const isNormal = confidence > 0.35 && landmarks && landmarks.length > 0;
    const boneColor = isNormal ? '#00ff88' : '#ff4444';
    const glowColor = isNormal ? 'rgba(0, 255, 136, 0.5)' : 'rgba(255, 68, 68, 0.5)';

    skctx.font = 'bold 12px sans-serif';
    skctx.textAlign = 'left';
    skctx.fillStyle = boneColor;
    skctx.shadowColor = glowColor;
    skctx.shadowBlur = 10;
    const statusText = isNormal ? '✓ 骨骼追踪' : '✗ 等待检测';
    skctx.fillText(statusText, 10, 20);

    // 置信度条
    const barWidth = 60;
    const barHeight = 4;
    skctx.shadowBlur = 0;
    skctx.fillStyle = 'rgba(255,255,255,0.3)';
    skctx.fillRect(10, 28, barWidth, barHeight);
    skctx.fillStyle = boneColor;
    skctx.fillRect(10, 28, barWidth * Math.max(0, confidence), barHeight);

    // 手势状态
    if (isNormal) {
      const gestureText = state.raw.leftHandUp || state.raw.rightHandUp ? '⚡ 加速' :
                         confirmedDir !== 0 ? (confirmedDir < 0 ? '◀ 左' : '右 ▶') : '站立';
      skctx.font = 'bold 10px sans-serif';
      skctx.fillStyle = gestureText.includes('⚡') ? '#ffeb3b' : '#fff';
      skctx.shadowColor = glowColor;
      skctx.shadowBlur = 10;
      skctx.fillText(gestureText, 10, 50);
      skctx.shadowBlur = 0;
    }

    // === 实时骨骼点数据（不管有没有检测到人都显示） ===
    skctx.save();
    skctx.fillStyle = '#fff';
    skctx.font = '9px monospace';
    skctx.textAlign = 'left';

    const lw = landmarks ? landmarks[KEYPOINT.LEFT_WRIST] : null;
    const rw = landmarks ? landmarks[KEYPOINT.RIGHT_WRIST] : null;
    const ls = landmarks ? landmarks[KEYPOINT.LEFT_SHOULDER] : null;
    const rs = landmarks ? landmarks[KEYPOINT.RIGHT_SHOULDER] : null;

    let yPos = 170;
    // 第一行：手腕坐标
    skctx.fillStyle = '#0ff';
    skctx.fillText('LW: ' + (lw && lw.score > 0.3 ? `${lw.x.toFixed(2)}, ${lw.y.toFixed(2)}` : '---'), 6, yPos);
    yPos -= 10;
    skctx.fillText('RW: ' + (rw && rw.score > 0.3 ? `${rw.x.toFixed(2)}, ${rw.y.toFixed(2)}` : '---'), 6, yPos);
    yPos -= 10;

    // 第二行：速度
    const now = performance.now();
    const dt = (now - prevLeftWristTime) / 1000;
    const dtR = (now - prevRightWristTime) / 1000;
    let leftVelX = 0, leftVelY = 0, rightVelX = 0, rightVelY = 0;
    if (prevLeftWrist && lw && lw.score > 0.3 && dt > 0.01 && dt < 0.5) {
      leftVelX = (lw.x - prevLeftWrist.x) / dt;
      leftVelY = (lw.y - prevLeftWrist.y) / dt;
    }
    if (prevRightWrist && rw && rw.score > 0.3 && dtR > 0.01 && dtR < 0.5) {
      rightVelX = (rw.x - prevRightWrist.x) / dtR;
      rightVelY = (rw.y - prevRightWrist.y) / dtR;
    }

    const leftVelColor = leftVelX < -0.5 || leftVelY < -0.4 ? '#ffeb3b' : '#aaa';
    const rightVelColor = rightVelX > 0.5 || rightVelY < -0.4 ? '#ffeb3b' : '#aaa';

    skctx.fillStyle = leftVelColor;
    skctx.fillText('LV: (' + leftVelX.toFixed(1) + ',' + leftVelY.toFixed(1) + ')', 6, yPos);
    yPos -= 10;
    skctx.fillStyle = rightVelColor;
    skctx.fillText('RV: (' + rightVelX.toFixed(1) + ',' + rightVelY.toFixed(1) + ')', 6, yPos);
    yPos -= 10;

    // 第三行：挥手历史
    skctx.fillStyle = '#aaa';
    skctx.fillText('HIST: L' + leftWaveHistory.length + ' R' + rightWaveHistory.length + '  DIR:' + confirmedDir, 6, yPos);
    yPos -= 10;

    // 置信度
    skctx.fillText('CONF: ' + (confidence * 100).toFixed(0) + '%', 6, yPos);

    skctx.restore();
  }

    // 帧循环
  async function frameLoop() {
    if (!state.enabled) return;

    if (!video || video.readyState < 2) {
      frameLoopId = requestAnimationFrame(frameLoop);
      return;
    }

    // 实时检测并绘制
    if (detector && detectorReady) {
      try {
        const poses = await detector.estimatePoses(video, {
          flipHorizontal: true // 镜像
        });

        if (poses && poses.length > 0) {
          const pose = poses[0];
          const landmarks = pose.keypoints;

          if (landmarks && landmarks.length > 0) {
            processLandmarks(landmarks);
            drawSkeleton(landmarks, state.confidence);

            logCounter++;
            if (logCounter % 60 === 0) {
              console.log('[MoveNet] 骨骼检测中 - 置信:', (state.confidence * 100).toFixed(0) + '%',
                '| 关键点数:', landmarks.filter(l => l.score > 0.3).length,
                '| 左手上举:', state.raw.leftHandUp ? '✓' : '-',
                '| 右手上举:', state.raw.rightHandUp ? '✓' : '-');
            }
          } else {
            state.confidence = Math.max(0, state.confidence - 0.05);
            drawSkeleton(null, 0);
          }
        } else {
          state.confidence = Math.max(0, state.confidence - 0.05);
          drawSkeleton(null, 0);
        }
      } catch (e) {
        console.warn('[MoveNet] 检测错误:', e.message);
      }
    } else {
      // 检测器未就绪时显示等待
      if (logCounter % 60 === 0) {
        console.log('[MoveNet] 等待检测器就绪... TensorFlow:', !!window.tf, 'MoveNet:', !!window.poseDetection,
          'detector:', !!detector, 'detectorReady:', detectorReady);
      }
      drawSkeleton(null, 0);  // 骨架画布也需要更新
    }

    logCounter++;
    frameLoopId = requestAnimationFrame(frameLoop);
  }

  // 启动摄像头
  async function start() {
    video = document.getElementById('cameraVideo');
    sk = document.getElementById('skeletonCanvas');
    skctx = sk.getContext('2d');
    sk.style.display = 'block';  // 始终显示骨骼画布，确保骨骼点能看见

    console.log('[Camera] 启动摄像头...');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      console.error('[Camera] 不支持 getUserMedia');
      setInputModeUI("不支持摄像头");
      return false;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });

      video.srcObject = stream;
      video.style.display = 'block';
      sk.style.display = 'block';

      await new Promise((resolve) => {
        if (video.readyState >= 2) resolve();
        else {
          video.onloadedmetadata = resolve;
          setTimeout(resolve, 3000);
        }
      });
      await video.play();

      console.log('[Camera] 视频已就绪');

      // 初始化 MoveNet 检测器
      await initDetector();

      // 开始检测循环
      state.enabled = state.ready = state.hasCamera = true;
      frameLoop();

      if (detectorReady) {
        showCenterMessage("MoveNet 骨骼追踪已开启!", 2000);
        console.log('[Camera] MoveNet 骨骼追踪已启动');
      } else {
        showCenterMessage("摄像头已开启（MoveNet加载中...）", 2000);
        console.log('[Camera] 摄像头已开启，等待MoveNet加载...');
      }

      setInputModeUI("体感+键鼠");
      return true;

    } catch (e) {
      console.error('[Camera] 启动失败:', e);
      state.enabled = state.ready = state.hasCamera = false;
      setInputModeUI("键鼠/触摸");
      showCenterMessage("摄像头不可用，已切换键鼠模式", 1800);
      return false;
    }
  }

  function stop() {
    if (frameLoopId) {
      cancelAnimationFrame(frameLoopId);
      frameLoopId = null;
    }
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    if (video) {
      video.pause();
      video.srcObject = null;
      video.style.display = 'none';
    }
    if (sk) sk.style.display = 'none';

    state.enabled = state.ready = state.hasCamera = false;
    state.confidence = 0;
    confirmedDir = 0;
    prevLeftWrist = null;
    prevRightWrist = null;

    setInputModeUI("键鼠/触摸");
  }

  function tick() {
    return state;
  }

  function getState() {
    return {
      ...state,
      turnHint: state.turnHint,
      nearIntersection: state.nearIntersection
    };
  }

  window.LocalCameraRecognizer = { start, stop, tick, getState };

  // 测试函数
  window.__cameraTest = function() {
    console.log('=== 摄像头测试 ===');
    console.log('TensorFlow.js:', !!window.tf);
    console.log('MoveNet:', !!window.poseDetection);
    console.log('检测器就绪:', detectorReady);
    console.log('状态:', getState());
  };

  setTimeout(() => {
    console.log('[Camera] 初始化完成');
    console.log('[Camera] TensorFlow.js:', !!window.tf);
    console.log('[Camera] MoveNet:', !!window.poseDetection);
    window.__cameraTest();
  }, 1500);

})();

const Input={
  horizontalIntent:0,forwardBoostIntent:false,reverseIntent:false,
  brakeHold:false,paintActive:false,lastSource:"键鼠/触摸",
  keys:{},pointerDown:false,pointerStartX:0,pointerX:0,pointerY:0,
  pointerLastX:0,pointerLastY:0,pointerMotion:0,pointerDownTime:0,
  lastDirChange:0,lastBrake:0,
  stopped:false,  // 下键切换的停止状态
  update(dt){
    let now=performance.now()/1000,ki=0,kb=false,kr=false,kbr=false,kp=false;
    if(this.keys.ArrowLeft||this.keys.KeyA)ki=-1;
    if(this.keys.ArrowRight||this.keys.KeyD)ki=1;
    if(this.keys.ArrowUp||this.keys.KeyW)kb=true;
    if(this.keys.Space)kbr=true;
    if(this.keys.KeyJ)kp=true;
    let pi=0,pbr=false,pp=false;
    if(this.pointerDown){
      let dx=this.pointerX-this.pointerStartX,dead=Math.max(36,innerWidth*.08);
      pi=dx<-dead?-1:dx>dead?1:0;
      let mdx=this.pointerX-this.pointerLastX,mdy=this.pointerY-this.pointerLastY;
      this.pointerMotion=this.pointerMotion*.82+Math.hypot(mdx,mdy)*.18;
      pp=this.pointerMotion>4.5;pbr=now-this.pointerDownTime>.45&&this.pointerMotion<2.2
    }else this.pointerMotion*=.85;
    let cam=LocalCameraRecognizer.getState(),
      ca=cam.enabled&&cam.ready&&(cam.confidence>.08||cam.action.brakeHold||cam.action.forwardBoostIntent||cam.action.brakeTrigger||cam.action.waveUpTrigger)?cam.action:null;
    let di=0,bo=false,rv=false,br=false,pa=false,src="键鼠/触摸";
    if(ki||kb||kbr||kp){di=ki;bo=kb;rv=kr;br=this.stopped&&!kb||kbr;pa=kp;src="键盘"}
    else if(this.pointerDown){di=pi;br=this.stopped||pbr;pa=pp;src="鼠标/触摸"}
    else if(ca){
      // 体感输入处理
      // 握拳触发 → 切换停止状态
      if(ca.brakeTrigger) this.stopped=!this.stopped;
      // 向上挥手触发 → 停止时恢复前进，否则加速
      if(ca.waveUpTrigger){
        if(this.stopped) this.stopped=false;
        else bo=true;
      }
      // 水平方向输入：只有接近路口时才有效
      di=ca.horizontalIntent;
      bo=bo||ca.forwardBoostIntent;
      br=this.stopped||ca.brakeHold;
      src=br?"体感（握拳）":bo?"体感（加速）":di!==0?"体感（"+("left"===(ca.turnHint||(di<0?"left":"right")))?"左":"右"+"转）":"体感";
    }
    if(di!==this.horizontalIntent&&(now-this.lastDirChange>.2||di===0)){this.horizontalIntent=di;this.lastDirChange=now}
    this.brakeHold=br;this.forwardBoostIntent=bo;this.reverseIntent=rv;this.paintActive=pa;this.lastSource=src;
    this.pointerLastX=this.pointerX;this.pointerLastY=this.pointerY
  }
};

addEventListener("keydown",e=>{Input.keys[e.code]=true;if(e.code==="KeyR")resetGame();});
addEventListener("keyup",e=>Input.keys[e.code]=false);
addEventListener("keydown",e=>{if(e.code==="ArrowDown"||e.code==="KeyS"){Input.stopped=!Input.stopped}});
addEventListener("pointerdown",e=>{Input.pointerDown=true;Input.pointerStartX=Input.pointerX=Input.pointerLastX=e.clientX;Input.pointerY=Input.pointerLastY=e.clientY;Input.pointerMotion=0;Input.pointerDownTime=performance.now()/1000});
addEventListener("pointermove",e=>{Input.pointerX=e.clientX;Input.pointerY=e.clientY});
addEventListener("pointerup",()=>Input.pointerDown=false);

document.getElementById('btnCamStart').onclick=()=>LocalCameraRecognizer.start();
document.getElementById('btnCamStop').onclick=()=>LocalCameraRecognizer.stop();
document.getElementById('btnReinit').onclick=()=>{

};

// WebGL 检测 & 2D 兜底渲染
// ============================================================
const Fallback2D = {
  ctx: null,
  ready: false,

  init() {
    const cvs = document.getElementById('fallbackCanvas');
    if (!cvs) return;
    cvs.style.display = 'block';
    this.ctx = cvs.getContext('2d');
    this.ready = true;
    this.resize();
    addEventListener('resize', () => this.resize());
  },

  resize() {
    const cvs = document.getElementById('fallbackCanvas');
    if (cvs) { cvs.width = innerWidth; cvs.height = innerHeight; }
  },

  draw(t) {
    if (!this.ready || !this.ctx) return;
    const ctx = this.ctx;
    const w = innerWidth, h = innerHeight;

    ctx.fillStyle = '#1a1d24';
    ctx.fillRect(0, 0, w, h);

    const cx = w/2, cy = h/2;
    const gridSize = 40;
    const offsetX = cx, offsetY = cy - 60;

    ctx.strokeStyle = '#4a5568';
    ctx.lineWidth = 3;

    for (let row = 0; row <= 4; row++) {
      const y = offsetY + (row - 2) * gridSize;
      ctx.beginPath();
      ctx.moveTo(60, y);
      ctx.lineTo(w - 60, y);
      ctx.stroke();
    }

    for (let col = 0; col <= 6; col++) {
      const x = offsetX + (col - 3) * gridSize;
      ctx.beginPath();
      ctx.moveTo(x, offsetY - 60);
      ctx.lineTo(x, offsetY + 120);
      ctx.stroke();
    }

    const p = Game.player.pos;
    const px = offsetX + p.x * 3;
    const py = offsetY + (p.z - 12) * 2;

    ctx.fillStyle = '#00e5ff';
    ctx.beginPath();
    ctx.arc(px, py, 12, 0, Math.PI * 2);
    ctx.fill();

    canDefs.forEach(c => {
      if (c.collected) return;
      const gx = offsetX + c.x * 3;
      const gy = offsetY + (c.z - 12) * 2;
      ctx.fillStyle = '#' + (COLORS[c.colorType] || 0xffffff).toString(16).padStart(6, '0');
      ctx.beginPath();
      ctx.arc(gx, gy, 6, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = '#fff176';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('2D 兜底模式 (WebGL 不可用)', w/2, 40);
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText('键盘 A/D 控制方向，W 加速，J 喷涂', w/2, 65);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('分数: ' + Game.score, w - 20, 40);
  }
};

let _webglAvailable = null;
function checkWebGL() {
  if (_webglAvailable !== null) return _webglAvailable;
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    _webglAvailable = !!gl;
    return _webglAvailable;
  } catch (e) {
    _webglAvailable = false;
    return false;
  }
}

function initThreeGame() {

  try {
  if (window.__THREE_LOAD_FAILED__ || !window.THREE) {

  }

function buildGround() {
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color: 0x5a5e66, roughness: 0.9 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.05;
  scene.add(ground);
}

function buildRoads() {
  const roadMat = new THREE.MeshStandardMaterial({ color: COLORS.road, roughness: 0.85 });
  const roadWidth = 3.4;

  roadSegments.forEach(seg => {
    const nA = gridNodes[seg.fromNode];
    const nB = gridNodes[seg.toNode];
    const dx = nB.x - nA.x, dz = nB.z - nA.z;
    const len = Math.hypot(dx, dz);
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(roadWidth, 0.16, len),
      roadMat.clone()
    );
    mesh.position.set((nA.x + nB.x)/2, 0.04, (nA.z + nB.z)/2);
    mesh.rotation.y = Math.atan2(dx, dz);
    mesh.userData.segId = seg.id;
    scene.add(mesh);
    Game.meshes.roads[seg.id] = mesh;

    const edgeMat = new THREE.MeshStandardMaterial({ color: COLORS.sidewalk, roughness: 0.7 });
    [-1, 1].forEach(s => {
      const edge = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.22, len), edgeMat.clone());
      edge.position.copy(mesh.position);
      edge.rotation.copy(mesh.rotation);
      edge.position.x += Math.cos(mesh.rotation.y) * s * (roadWidth/2 + 0.1);
      edge.position.z += -Math.sin(mesh.rotation.y) * s * (roadWidth/2 + 0.1);
      scene.add(edge);
    });

    const paintOverlay = new THREE.Mesh(
      new THREE.BoxGeometry(roadWidth - 0.2, 0.06, len),
      new THREE.MeshBasicMaterial({ color: 0xff4141, transparent: true, opacity: 0 })
    );
    paintOverlay.position.set((nA.x + nB.x)/2, 0.12, (nA.z + nB.z)/2);
    paintOverlay.rotation.y = mesh.rotation.y;
    scene.add(paintOverlay);
    Game.meshes.roadPaint[seg.id] = paintOverlay;
  });

  gridNodes.forEach(n => {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(3.4, 0.16, 3.4),
      new THREE.MeshStandardMaterial({ color: COLORS.road, roughness: 0.85 })
    );
    m.position.set(n.x, 0.04, n.z);
    scene.add(m);
  });
}

function buildBlocks() {
  const blockMat = [0x8d929a, 0x747982, 0xa4a8ae, 0x6e7278, 0x9e9fa3];
  blocks.forEach((b, i) => {
    const g = new THREE.Group();
    const base = new THREE.Mesh(
      new THREE.BoxGeometry(GRID_W - 3.8, 0.12, GRID_H - 3.8),
      new THREE.MeshStandardMaterial({ color: 0x9a9ea6, roughness: 0.8 })
    );
    base.position.y = 0.06;
    g.add(base);

    const numBuildings = 3 + (i % 4);
    for (let k = 0; k < numBuildings; k++) {
      const w = 1.2 + Math.random() * 2.2;
      const h = 1.8 + Math.random() * 6;
      const d = 1.2 + Math.random() * 2.2;
      const bld = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color: blockMat[(i + k) % blockMat.length], roughness: 0.8 })
      );
      bld.position.set(
        (Math.random() - 0.5) * (GRID_W - 4.5 - w),
        h / 2 + 0.12,
        (Math.random() - 0.5) * (GRID_H - 4.5 - d)
      );
      bld.userData.baseColor = bld.material.color.clone();
      g.add(bld);
    }
    g.position.set(b.cx, 0, b.cz);
    scene.add(g);
    Game.meshes.blocks[b.id] = g;
  });
}

function buildCans() {
  canDefs.forEach((c, i) => {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: COLORS[c.colorType], emissive: COLORS[c.colorType], emissiveIntensity: 0.2 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.85, 18), mat);
    body.rotation.x = Math.PI / 2;
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.5, 0.035, 8, 28),
      new THREE.MeshBasicMaterial({ color: COLORS[c.colorType], transparent: true, opacity: 0.78 })
    );
    ring.rotation.x = Math.PI / 2;
    g.add(body, ring);
    g.position.set(c.x, c.y, c.z);
    g.userData.baseY = c.y;
    Game.meshes.cans.push(g);
    scene.add(g);
  });
}

function buildPlayer() {
  const g = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00d5ff });
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.8, 16), bodyMat);
  const cap1 = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 8, 0, Math.PI*2, 0, Math.PI/2), bodyMat);
  const cap2 = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 8, 0, Math.PI*2, Math.PI/2, Math.PI/2), bodyMat);
  cap1.position.y = 0.4;
  cap2.position.y = -0.4;
  const body = new THREE.Group();
  body.add(cyl, cap1, cap2);
  body.position.y = 1.1;

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 18, 14), new THREE.MeshStandardMaterial({ color: 0xffd2a6 }));
  head.position.y = 1.98;
  const board = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.15, 0.5), new THREE.MeshStandardMaterial({ color: 0x1f2430 }));
  board.position.y = 0.15;
  const lh = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), new THREE.MeshStandardMaterial({ color: 0xffd2a6 }));
  const rh = lh.clone();
  lh.position.set(-0.6, 1.3, 0);
  rh.position.set(0.6, 1.3, 0);
  const halo = new THREE.Mesh(
    new THREE.TorusGeometry(0.88, 0.04, 8, 36),
    new THREE.MeshBasicMaterial({ color: COLORS.none, transparent: true, opacity: 0.95 })
  );
  halo.rotation.x = Math.PI / 2;
  halo.position.y = 0.04;
  g.add(board, body, head, lh, rh, halo);
  scene.add(g);
  Object.assign(Game.player, { group: g, board, halo, leftHand: lh, rightHand: rh });

function initPlayerPosition() {
  const startNode = getNode(3, 4);
  Game.player.pos = { x: startNode.x, y: 0, z: startNode.z };
  const initSeg = roadSegments.find(s => s.id === 'v_3_3');
  if (initSeg) {
    Game.player.currentSegment = initSeg;
    Game.player.segT = 1.0;
    Game.player.segDir = -1;
  }
  updatePlayerTransform();

function loop() {
  requestAnimationFrame(loop);
  if (!gameReady) return;
  if (useFallback2D) return;

  const dt = Math.min(clock.getDelta(), 0.05);
  lastTime += dt;

  LocalCameraRecognizer.tick();
  Input.update(dt);
  updatePlayer(dt);
  updateCollisions();
  updateAnimations(dt);
  updateCamera(dt);
  updateUI();
  updateDebugPanel();
  drawMiniMap();
  renderer.render(scene, camera);
}

function updatePlayer(dt) {
  const p = Game.player;
  if (Game.state === 'win') { updatePlayerTransform(); return; }

  if (Input.brakeHold) {
    p.speed = Math.max(0, p.speed - dt * 15);
    updatePlayerTransform();
    return;
  }

  if (Game.state === 'idle') {
    if (Input.horizontalIntent !== 0 || Input.forwardBoostIntent) {
      Game.state = 'skating';
      p.speed = PARAMS.moveSpeed;
      showCenterMessage('出发！收集喷罐，给街道涂上颜色！', 1600);
    }
    updatePlayerTransform();
    return;
  }

  const speed = Input.forwardBoostIntent ? PARAMS.boostSpeed : PARAMS.moveSpeed;
  p.speed = speed;

  if (!p.currentSegment) {
    const nearest = findNearestNode(p.pos.x, p.pos.z);
    const segs = getSegsOfNode(nearest.id);
    if (segs.length > 0) {
      p.currentSegment = segs[0];
      p.segT = 0;
      p.segDir = 1;
    }
    return;
  }

  const seg = p.currentSegment;
  const nA = gridNodes[seg.fromNode];
  const nB = gridNodes[seg.toNode];
  const len = Math.hypot(nB.x - nA.x, nB.z - nA.z);

  let tDelta = (p.speed * dt) / len;
  if (Input.reverseIntent) tDelta = -tDelta;

  p.segT += tDelta * p.segDir;

  if (p.segT >= 1.0 || p.segT <= 0.0) {
    const reachedNode = p.segT >= 1.0 ? gridNodes[seg.toNode] : gridNodes[seg.fromNode];
    p.segT = p.segT >= 1.0 ? 1.0 : 0.0;

    const nextSeg = chooseNextSegment(seg, reachedNode, Input.horizontalIntent);
    if (nextSeg) {
      const newDir = nextSeg.fromNode === reachedNode.id ? 1 : -1;
      p.currentSegment = nextSeg;
      p.segDir = newDir;
      p.segT = newDir === 1 ? 0.0 : 1.0;
    }
  }

  const t = p.segT;
  p.pos.x = nA.x + (nB.x - nA.x) * t;
  p.pos.z = nA.z + (nB.z - nA.z) * t;

  const dx = (nB.x - nA.x) * p.segDir;
  const dz = (nB.z - nA.z) * p.segDir;
  const targetYaw = Math.atan2(dx, dz);
  p.yaw = lerpAngle(p.yaw, targetYaw, Math.min(1, dt * 8));

  updatePlayerTransform();

  if (Input.paintActive) {
    tryPaintNearbyRoad(dt);
  }
}

function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

function chooseNextSegment(currentSeg, nodeAtEnd, horizInput) {
  const candidates = getSegsOfNode(nodeAtEnd.id).filter(s => s !== currentSeg);
  if (candidates.length === 0) return currentSeg;
  if (candidates.length === 1) return candidates[0];

  // 使用玩家当前朝向作为前进方向参考
  const forwardAngle = Game.player.yaw;

  let best = candidates[0];
  let bestScore = -999;
  candidates.forEach(seg => {
    const nOther = seg.fromNode === nodeAtEnd.id ? gridNodes[seg.toNode] : gridNodes[seg.fromNode];
    const dx2 = nOther.x - nodeAtEnd.x;
    const dz2 = nOther.z - nodeAtEnd.z;
    const angle = Math.atan2(dx2, dz2);
    let diff = angle - forwardAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    let score = -Math.abs(diff);
    // 左键(-1)左转，右键(1)右转
    if (horizInput < 0) score = -Math.abs(diff + Math.PI/2);  // 左转选-90度
    if (horizInput > 0) score = -Math.abs(diff - Math.PI/2); // 右转选+90度
    if (Math.abs(diff) > Math.PI * 0.9) score -= 10;
    if (score > bestScore) { bestScore = score; best = seg; }
  });
  return best;
}

function getSegsOfNode(nodeId) {
  return roadSegments.filter(s => s.fromNode === nodeId || s.toNode === nodeId);
}

function findNearestNode(x, z) {
  let best = gridNodes[0], bestD = Infinity;
  gridNodes.forEach(n => {
    const d = Math.hypot(n.x - x, n.z - z);
    if (d < bestD) { bestD = d; best = n; }
  });
  return best;
}

// 检测玩家是否接近路口
function isNearIntersection(threshold = TURN_AHEAD_DISTANCE) {
  const p = Game.player;
  const currentNode = findNearestNode(p.pos.x, p.pos.z);
  const distToNode = Math.hypot(currentNode.x - p.pos.x, currentNode.z - p.pos.z);
  return distToNode < threshold;
}

// 检测前方是否有转弯路口
function hasUpcomingTurn() {
  const p = Game.player;
  const seg = p.currentSegment;
  if (!seg) return false;

  // 获取当前路段末端的节点
  const endNodeId = p.segDir > 0 ? seg.toNode : seg.fromNode;
  const endNode = gridNodes[endNodeId];
  if (!endNode) return false;

  // 检查到达终点前是否需要转向（当前路段是直路，前方有岔路）
  const connectedSegs = getSegsOfNode(endNodeId);
  // 如果连接的路段只有2个（当前来的 + 即将去的），说明是直路
  // 如果有3个或更多，说明是岔路口
  return connectedSegs.length > 2;
}

// 检测是否需要提前预判转向
function shouldPrepareForTurn() {
  const p = Game.player;
  const seg = p.currentSegment;
  if (!seg) return false;

  const nA = gridNodes[seg.fromNode];
  const nB = gridNodes[seg.toNode];
  const len = Math.hypot(nB.x - nA.x, nB.z - nA.z);

  // 计算当前位置到路段终点的距离
  const t = p.segT;
  const distToEnd = p.segDir > 0 ? (1 - t) * len : t * len;

  // 提前 TURN_AHEAD_DISTANCE 距离开始识别
  return distToEnd < TURN_AHEAD_DISTANCE;
}

function updatePlayerTransform() {
  const p = Game.player;
  const g = p.group;
  if (!g) return;
  g.position.set(p.pos.x, 0, p.pos.z);
  g.rotation.y = p.yaw;

  p.boardTilt = p.boardTilt * 0.82 + (-Input.horizontalIntent * 0.14) * 0.18;
  p.board.rotation.z = p.boardTilt;
  g.rotation.z = p.boardTilt * 0.35;

  p.leftHand.position.y  = 1.3 + (Input.paintActive ? Math.abs(Math.sin(lastTime*15))*0.45 : Input.forwardBoostIntent ? 0.55 : Math.sin(lastTime*8)*0.12);
  p.rightHand.position.y = 1.3 + (Input.paintActive ? Math.abs(Math.cos(lastTime*15))*0.45 : Input.forwardBoostIntent ? 0.55 : -Math.sin(lastTime*8)*0.12);

  if (Input.brakeHold) {
    p.leftHand.position.set(-0.25, 1.15, 0.18);
    p.rightHand.position.set(0.25, 1.15, 0.18);
  } else {
    p.leftHand.position.x = -0.6; p.leftHand.position.z = 0;
    p.rightHand.position.x = 0.6; p.rightHand.position.z = 0;
  }
  p.halo.material.color.setHex(COLORS[p.carriedColor] || COLORS.none);
  p.halo.rotation.z += Input.forwardBoostIntent ? 0.07 : 0.035;
}

function updateCollisions() {
  const pp = Game.player.pos;
  canDefs.forEach((c, i) => {
    if (c.collected) return;
    if (Math.hypot(pp.x - c.x, pp.z - c.z) < c.radius) {
      c.collected = true;
      Game.meshes.cans[i].visible = false;
      setCarriedColor(c.colorType);
      spawnColorSplash(c.x, c.y, c.z, COLORS[c.colorType], 16);
      showCenterMessage('获得 ' + COLOR_NAMES[c.colorType] + ' 色喷漆！按J喷涂路面', 1200);
    }
  });
}

function tryPaintNearbyRoad(dt) {
  const p = Game.player;
  const seg = p.currentSegment;
  if (!seg) return;
  if (!p.carriedColor || p.carriedColor === 'none') {
    showCenterMessage('需要先收集喷漆罐！', 900);
    return;
  }

  seg.paintProgress = Math.min(100, (seg.paintProgress || 0) + (100 / PARAMS.paintDuration) * dt);
  const overlay = Game.meshes.roadPaint[seg.id];
  if (overlay) {
    overlay.material.color.setHex(COLORS[p.carriedColor] || COLORS.red);
    overlay.material.opacity = (seg.paintProgress / 100) * 0.72;
  }

  spawnPaintParticles(COLORS[p.carriedColor]);

  if (seg.paintProgress >= 100 && !seg.paintColor) {
    seg.paintColor = p.carriedColor;
    Game.score += 50;
    checkBlocksCompletion();
    if (blocks.every(b => b.painted)) {
      Game.state = 'win';
      showCenterMessage('🎉 恭喜通关！所有街区涂色完成！', 8000);
      colorizeCity();
    }
  }
}

function checkBlocksCompletion() {
  blocks.forEach(b => {
    if (b.painted) return;
    const surrounding = [
      `h_${b.col}_${b.row}`,
      `h_${b.col}_${b.row+1}`,
      `v_${b.col}_${b.row}`,
      `v_${b.col+1}_${b.row}`
    ];
    const allPainted = surrounding.every(id => {
      const s = roadSegments.find(r => r.id === id);
      return s && s.paintColor;
    });
    if (allPainted) {
      b.painted = true;
      Game.score += 200;
      dom.paintedCount.textContent = blocks.filter(x => x.painted).length;
      dom.scoreVal.textContent = Game.score;
      const g = Game.meshes.blocks[b.id];
      if (g) {
        const pal = [COLORS.red, COLORS.yellow, COLORS.blue, COLORS.green, COLORS.orange, COLORS.pink];
        g.traverse(child => {
          if (child.isMesh && child.material) {
            child.material.color.setHex(pal[Math.floor(Math.random() * pal.length)]);
          }
        });
      }
      spawnColorSplash(b.cx, 1, b.cz, COLORS[b.targetColor] || COLORS.cyan, 30);
      showCenterMessage('街区完成 +200分！', 1000);
    }
  });
  dom.scoreVal.textContent = Game.score;
}

function colorizeCity() {
  const pal = [COLORS.red, COLORS.yellow, COLORS.blue, COLORS.green, COLORS.orange, COLORS.pink, COLORS.cyan];
  blocks.forEach((b, i) => {
    const g = Game.meshes.blocks[b.id];
    if (g) g.traverse(c => { if (c.isMesh && c.material) c.material.color.setHex(pal[i % pal.length]); });
  });
}

function updateAnimations(dt) {
  Game.meshes.cans.forEach((m, i) => {
    if (m && m.visible) {
      m.rotation.y += dt * 2.4;
      m.position.y = canDefs[i].y + Math.sin(lastTime * 3 + i) * 0.18;
    }
  });
  for (let i = Game.meshes.particles.length - 1; i >= 0; i--) {
    const p = Game.meshes.particles[i];
    p.userData.age += dt;
    p.position.addScaledVector(p.userData.velocity, dt);
    p.userData.velocity.y -= dt * 4;
    const r = 1 - p.userData.age / p.userData.life;
    p.material.opacity = Math.max(0, r);
    p.scale.setScalar(Math.max(0.02, r));
    if (p.userData.age >= p.userData.life) { scene.remove(p); Game.meshes.particles.splice(i, 1); }
  }
}

function spawnPaintParticles(color) {
  const pos = Game.player.pos;
  for (let i = 0; i < 2; i++) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 8, 6),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95 })
    );
    m.position.set(pos.x + (Math.random()-0.5)*0.6, 0.8, pos.z + (Math.random()-0.5)*0.6);
    m.userData.velocity = new THREE.Vector3((Math.random()-0.5)*3, Math.random()*2+1, (Math.random()-0.5)*3);
    m.userData.life = 0.6;
    m.userData.age = 0;
    Game.meshes.particles.push(m);
    scene.add(m);
  }
}

function spawnColorSplash(x, y, z, color, count) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.07 + Math.random() * 0.08, 8, 6),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95 })
    );
    m.position.set(x, y, z);
    m.userData.velocity = new THREE.Vector3((Math.random()-0.5)*6, Math.random()*5+1, (Math.random()-0.5)*6);
    m.userData.life = 0.9 + Math.random() * 0.55;
    m.userData.age = 0;
    Game.meshes.particles.push(m);
    scene.add(m);
  }
}

function updateCamera(dt) {
  const p = Game.player.pos;
  const yaw = Game.player.yaw;

  let h = 11, back = 14, look = 7;
  if (Game.state === 'idle') { h = 10; back = 13; look = 5; }
  if (Input.forwardBoostIntent && Game.state === 'skating') { back = 17; look = 9; }
  if (Input.brakeHold) { h = 9; back = 10; look = 3; }
  if (Game.state === 'win') { h = 22; back = 25; look = 0; }

  // 根据玩家朝向计算摄像机位置（始终在玩家正后方）
  // yaw=0 时玩家面向 +Z，摄像机应在 -Z 方向
  const camTargetX = p.x - Math.sin(yaw) * back;
  const camTargetZ = p.z - Math.cos(yaw) * back;
  camera.position.lerp(new THREE.Vector3(camTargetX, h, camTargetZ), Math.min(1, dt * 4.5));

  // 根据玩家朝向计算看向的目标点（始终看向玩家正前方）
  const lookFwX = p.x + Math.sin(yaw) * look;
  const lookFwZ = p.z + Math.cos(yaw) * look;
  camera.lookAt(new THREE.Vector3(lookFwX, 1.5, lookFwZ));
}

function drawMiniMap() {
  const c = dom.miniMap;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(8,12,18,.72)';
  ctx.fillRect(0, 0, w, h);

  const worldW = 80, worldH = 68;
  const ox = w / 2, oz = h * 0.78;
  function tx(x) { return ox + x * (w / worldW); }
  function tz(z) { return oz + (z - 12) * (h / worldH); }

  ctx.lineCap = 'round';
  roadSegments.forEach(seg => {
    const nA = gridNodes[seg.fromNode], nB = gridNodes[seg.toNode];
    ctx.strokeStyle = seg.paintColor ? '#' + (COLORS[seg.paintColor] || COLORS.road).toString(16).padStart(6,'0') : '#6e7480';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(tx(nA.x), tz(nA.z));
    ctx.lineTo(tx(nB.x), tz(nB.z));
    ctx.stroke();
  });

  canDefs.forEach(c2 => {
    if (c2.collected) return;
    ctx.fillStyle = '#' + (COLORS[c2.colorType] || 0xffffff).toString(16).padStart(6, '0');
    ctx.beginPath();
    ctx.arc(tx(c2.x), tz(c2.z), 4, 0, Math.PI * 2);
    ctx.fill();
  });

  const pp = Game.player.pos;
  ctx.fillStyle = Input.forwardBoostIntent ? '#49ff88' : '#00e5ff';
  ctx.beginPath();
  ctx.arc(tx(pp.x), tz(pp.z), Input.forwardBoostIntent ? 7 : 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#aaa';
  ctx.font = '11px sans-serif';
  ctx.fillText('●玩家  ●喷漆罐  ─已涂', 10, h - 12);
}

function updateUI() {
  const stateMap = {
    idle: '待命',
    skating: Input.brakeHold ? '停止中' : Input.forwardBoostIntent ? '加速滑行' : '滑行中',
    win: '通关！'
  };
  dom.stateText.textContent = stateMap[Game.state] || Game.state;
  dom.inputMode.textContent = Input.lastSource;

  const cam = LocalCameraRecognizer.getState();
  if (cam.enabled && cam.hasCamera) {
    dom.camStablePill.style.display = '';
    dom.camStable.textContent = cam.confidence > 0.3 ? '正常' : '等待中';
    dom.camStable.style.color = cam.confidence > 0.3 ? '#49ff88' : '#ff9800';
  } else {
    dom.camStablePill.style.display = 'none';
  }

  const cc = Game.player.carriedColor;
  dom.carriedText.textContent = COLOR_NAMES[cc] || '无';
  dom.carriedDot.style.background = '#' + ((COLORS[cc] || COLORS.none)).toString(16).padStart(6,'0');
  dom.carriedDot.style.color = dom.carriedDot.style.background;

  const seg = Game.player.currentSegment;
  const prog = seg ? (seg.paintProgress || 0) : 0;
  dom.progressBar.style.width = prog + '%';
  dom.progressText.textContent = Math.round(prog) + '%';

  if (cc !== 'none') {
    dom.targetDot.style.background = '#' + (COLORS[cc] || COLORS.none).toString(16).padStart(6,'0');
    dom.targetText.textContent = COLOR_NAMES[cc] || '-';
  } else {
    dom.targetDot.style.background = '#999';
    dom.targetText.textContent = '收集喷罐';
  }

  if (Game.state === 'idle') dom.tipText.textContent = '输入方向开始滑行！A/D或左右挥手转向，W或向上挥手加速';
  else if (Input.brakeHold) dom.tipText.textContent = '停止中——松开继续滑行';
  else if (Input.forwardBoostIntent) dom.tipText.textContent = '加速中！接近路口时挥手转向，路段上按J/拖动喷涂';
  else if (cc === 'none') dom.tipText.textContent = '收集地图上的彩色喷漆罐，然后按J喷涂路面';
  else if (Input.paintActive) dom.tipText.textContent = '喷涂中... 保持J键/拖动完成喷涂';
  else dom.tipText.textContent = '接近路口时挥手转向！按J/Space或拖动喷涂当前路段，完成4条围边即可给街区上色！';
}

function setCarriedColor(c) {
  Game.player.carriedColor = c;
  if (Game.player.halo) Game.player.halo.material.color.setHex(COLORS[c] || COLORS.none);
}

function showCenterMessage(t, d) {
  dom.centerMessage.textContent = t;
  dom.centerMessage.style.opacity = '1';
  clearTimeout(showCenterMessage._t);
  showCenterMessage._t = setTimeout(() => dom.centerMessage.style.opacity = '.18', d || 1400);
}

function setInputModeUI(t) {
  dom.inputMode.textContent = t;
  const cam = LocalCameraRecognizer.getState();
  dom.camStablePill.style.display = (cam.enabled && cam.hasCamera) ? '' : 'none';
}

function updateDebugPanel() {
  const panel = document.getElementById('debugPanel');
  if (!panel) return;

  const cam = LocalCameraRecognizer.getState();
  const videoEl = document.getElementById('cameraVideo');
  const videoReady = videoEl && videoEl.readyState >= 2;

  let detectMode = '未启动';
  if (cam.enabled) {
    detectMode = '运动检测';
  }

  const dirText = cam.action.horizontalIntent !== 0
    ? (cam.action.horizontalIntent < 0 ? '◀ 左' : '右 ▶')
    : cam.action.forwardBoostIntent ? '⚡ 加速'
    : cam.action.brakeHold ? '⬛ 停止'
    : '-';

  const turnHintText = cam.turnHint ? (cam.turnHint === 'left' ? '◀ 准备左转' : '▶ 准备右转') : '';

  const info = [];
  info.push('═══ 诊断 v5 ═══');
  info.push('游戏: ' + (gameReady ? '✓ 就绪' : '✗ 未就绪'));
  info.push('渲染: ' + (useFallback2D ? '2D' : '3D WebGL'));
  info.push('THREE: ' + (window.THREE ? '✓' : '✗'));
  info.push('═══ 摄像头 ═══');
  info.push('状态: ' + (cam.enabled ? '开启 ✓' : '关闭'));
  info.push('视频: ' + (videoReady ? '就绪 ✓' : '未就绪'));
  info.push('═══ 检测 ═══');
  info.push('模式: ' + detectMode);
  info.push('置信度: ' + (cam.confidence * 100).toFixed(1) + '%');
  info.push('体感输入: ' + dirText);
  info.push('路口预判: ' + (cam.nearIntersection ? '接近! ✓' : '-'));
  if (turnHintText) info.push('转向提示: ' + turnHintText);
  info.push('═══ 手势提示 ═══');
  info.push('向左挥手 = 左转');
  info.push('向右挥手 = 右转');
  info.push('向上挥手 = 加速');
  info.push('═══ 游戏 ═══');
  info.push('状态: ' + Game.state);
  info.push('分数: ' + Game.score);

  panel.innerHTML = info.map(line => {
    if (line.includes('✓')) return '<span style="color:#49ff88">' + line + '</span>';
    if (line.includes('✗')) return '<span style="color:#ff5252">' + line + '</span>';
    if (line.startsWith('══')) return '<span style="color:#ff9800">' + line + '</span>';
    return '<span style="color:#aaa">' + line + '</span>';
  }).join('<br>');

  panel.style.display = 'block';
  panel.style.fontSize = '11px';
  panel.style.lineHeight = '1.5';
  panel.style.maxWidth = '200px';
}

function resetGame() {
  Game.state = 'idle';
  Game.elapsed = 0;
  Game.score = 0;
  dom.scoreVal.textContent = '0';
  dom.paintedCount.textContent = '0';

  roadSegments.forEach(seg => {
    seg.paintProgress = 0;
    seg.paintColor = null;
    if (!useFallback2D) {
      const ov = Game.meshes.roadPaint[seg.id];
      if (ov) ov.material.opacity = 0;
    }
  });

  if (!useFallback2D) {
    blocks.forEach(b => {
      b.painted = false;
      const g = Game.meshes.blocks[b.id];
      if (g) {
        g.traverse(c => { if (c.isMesh && c.material && c.userData.baseColor) c.material.color.copy(c.userData.baseColor); });
      }
    });
  } else {
    blocks.forEach(b => b.painted = false);
  }

  canDefs.forEach((c, i) => {
    c.collected = false;
    if (!useFallback2D && Game.meshes.cans[i]) Game.meshes.cans[i].visible = true;
  });

  if (!useFallback2D) {
    Game.meshes.particles.forEach(p => scene && scene.remove(p));
    Game.meshes.particles.length = 0;
  }

  setCarriedColor('none');
  Game.player.yaw = Math.PI;
  Game.player.boardTilt = 0;
  initPlayerPosition();

  showCenterMessage('已重置！重新出发', 1800);
}

window.__THREE_LOAD_FAILED__ = false;
window.__THREE_LOADING_DONE__ = false;
const __THREE_CDN__ = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
(function () {
  var s = document.createElement('script');
  s.src = __THREE_CDN__;
  s.crossOrigin = 'anonymous';
  s.onerror = function () {
    console.log('[Load] CDN 失败，尝试 unpkg...');
    s.src = 'https://unpkg.com/three@0.149.0/build/three.min.js';
    s.onerror = function () {
      console.log('[Load] unpkg 失败，尝试 jsdelivr...');
      s.src = 'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js';
      s.onerror = function () {
        console.error('[Load] 所有 CDN 都失败了');
        window.__THREE_LOAD_FAILED__ = true;
        window.__THREE_LOADING_DONE__ = true;
      };
    };
  };
  s.onload = function () {
    console.log('[Load] Three.js 加载成功!');
    window.__THREE_LOADING_DONE__ = true;
  };
  document.head.appendChild(s);
  setTimeout(function () {
    if (!window.THREE) {
      window.__THREE_LOAD_FAILED__ = true;
      window.__THREE_LOADING_DONE__ = true;
    }
  }, 5000);
})();

window.__THREE_LOADING_PROMISE__ = new Promise(function (r) {
  function wait() {
    if (window.__THREE_LOADING_DONE__) r(!window.__THREE_LOAD_FAILED__);
    else setTimeout(wait, 100);
  }
  wait();
});

addEventListener('DOMContentLoaded', () => {
  console.log('[Boot] DOM 已就绪，开始初始化...');

  const boot = () => {
    if (window.__THREE_LOAD_FAILED__ || !window.THREE) {
      console.error('[Boot] Three.js 未加载，显示错误提示');
      dom.errorBox.style.display = 'block';
      dom.errorBox.innerHTML = '<strong>Three.js 加载失败，请检查网络连接。</strong>';
      initFallback2DMode();
    } else {
      console.log('[Boot] 开始调用 initThreeGame()');
      initThreeGame();
    }
  };

  if (window.__THREE_LOADING_DONE__) {
    boot();
  } else {
    window.__THREE_LOADING_PROMISE__.then(success => {
      console.log('[Boot] Three.js 加载 Promise 解析:', success ? '成功' : '失败');
      boot();
    });
  }
});
</script>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MoveNet 调试 - 检查数据格式</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1d24; color: #fff; }
    #log { background: #000; padding: 10px; height: 400px; overflow-y: scroll; white-space: pre-wrap; }
    button { padding: 10px 20px; margin: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>MoveNet 数据格式调试</h1>
  <button onclick="start()">启动摄像头</button>
  <button onclick="stop()">停止</button>
  <div id="log"></div>
  <canvas id="debugCanvas" width="640" height="480" style="border: 1px solid #fff;"></canvas>

  <script>
    let video, detector, stream;
    
    function log(msg) {
      const div = document.getElementById('log');
      div.innerHTML += msg + '\n';
      div.scrollTop = div.scrollHeight;
      console.log(msg);
    }

    async function start() {
      log('启动摄像头...');
      
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        
        log('视频已就绪');
        
        await tf.ready();
        log('TF.js 已就绪');
        
        const model = poseDetection.SupportedModels.MoveNet;
        const config = {
          modelType: poseDetection.movenet.modelType.SINGLEPOSELIGHTNING,
          enableSmoothing: true
        };
        
        detector = await poseDetection.createDetector(model, config);
        log('MoveNet 检测器已加载');
        
        detect();
      } catch (e) {
        log('错误: ' + e.message);
      }
    }

    async function detect() {
      if (!detector || video.readyState < 2) {
        requestAnimationFrame(detect);
        return;
      }

      try {
        const poses = await detector.estimatePoses(video, { flipHorizontal: false });
        
        if (poses && poses.length > 0) {
          const keypoints = poses[0].keypoints;
          
          log('=== 检测到姿态 ===');
          log('keypoints 类型: ' + typeof keypoints);
          log('keypoints 是否为数组: ' + Array.isArray(keypoints));
          log('keypoints 长度: ' + keypoints.length);
          
          if (keypoints[0]) {
            log('keypoints[0]: ' + JSON.stringify(keypoints[0]));
            log('keypoints[0].x: ' + keypoints[0].x + ' (类型: ' + typeof keypoints[0].x + ')');
            log('keypoints[0].y: ' + keypoints[0].y + ' (类型: ' + typeof keypoints[0].y + ')');
            log('keypoints[0].score: ' + keypoints[0].score);
          }
          
          // 绘制到 canvas
          const canvas = document.getElementById('debugCanvas');
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, 640, 480);
          ctx.drawImage(video, 0, 0, 640, 480);
          
          ctx.fillStyle = '#ff0000';
          keypoints.forEach((kp, i) => {
            if (kp.score > 0.3) {
              ctx.beginPath();
              ctx.arc(kp.x, kp.y, 5, 0, Math.PI * 2);
              ctx.fill();
              if (i < 3) log('关键点 ' + i + ': x=' + kp.x + ', y=' + kp.y);
            }
          });
          
          log('已绘制 ' + keypoints.length + ' 个关键点');
          log('---');
        }
      } catch (e) {
        log('检测错误: ' + e.message);
      }
      
      requestAnimationFrame(detect);
    }

    function stop() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      log('已停止');
    }
  </script>
</body>
</html>

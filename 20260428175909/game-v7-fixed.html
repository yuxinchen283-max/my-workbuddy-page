<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<title>涂鸦特工 - 街道版 v7 (修复版)</title>
<!-- TensorFlow.js + MoveNet 姿态检测 -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15171c;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 25%,#343842 0%,#1d2129 48%,#111319 100%)}
#cameraVideo{position:absolute;left:14px;bottom:70px;width:240px;height:180px;object-fit:cover;transform:scaleX(-1);opacity:.82;filter:contrast(1.08);display:none;z-index:8;border-radius:16px;border:2px solid rgba(255,255,255,.35);box-shadow:0 12px 36px rgba(0,0,0,.35);background:#111;pointer-events:none}
#skeletonCanvas{position:absolute;left:14px;bottom:70px;width:240px;height:180px;display:none;z-index:9;border-radius:16px;pointer-events:none}
#threeLayer{position:absolute;inset:0;z-index:1;filter:brightness(.7) saturate(.9)}
#ui{position:absolute;left:14px;top:12px;z-index:5;max-width:460px;padding:12px 14px;border-radius:16px;background:rgba(14,17,23,.72);box-shadow:0 10px 30px rgba(0,0,0,.25);backdrop-filter:blur(8px);font-size:14px;line-height:1.55;user-select:none}
#ui strong{color:#fff176}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14)}
.color-dot{width:14px;height:14px;border-radius:999px;background:#bbb;box-shadow:0 0 10px currentColor;display:inline-block;vertical-align:-2px}
#progressWrap{width:150px;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.18)}
#progressBar{width:0;height:100%;background:linear-gradient(90deg,#ff5252,#ffeb3b,#00e5ff);transition:width .08s linear}
#controls{position:absolute;right:14px;top:12px;z-index:6;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:390px}
button{appearance:none;border:0;border-radius:999px;padding:9px 13px;color:white;background:rgba(43,48,60,.82);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 6px 18px rgba(0,0,0,.25);cursor:pointer;font-weight:700}
button:hover{background:rgba(65,72,88,.92)}
#centerMessage{position:absolute;left:50%;top:19%;transform:translateX(-50%);z-index:7;padding:12px 18px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);font-size:22px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.55);pointer-events:none;opacity:1;transition:opacity .25s;white-space:nowrap}
#fallbackCanvas{position:absolute;inset:0;z-index:2;display:none;background:#171b22}
#errorBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;max-width:620px;padding:22px 26px;border-radius:18px;background:rgba(0,0,0,.78);display:none;line-height:1.7}
#debugPanel{position:absolute;right:14px;bottom:18px;z-index:20;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.2);font-size:12px;color:#aaa;max-width:260px;display:block}
#hintBottom{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.5);font-weight:800;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.22);user-select:none;font-size:13px}
#hiddenCanvas{display:none}
#miniMap{position:absolute;right:14px;top:62px;z-index:5;width:240px;height:300px;border-radius:18px;background:rgba(8,12,18,.72);border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 36px rgba(0,0,0,.32);backdrop-filter:blur(8px)}
#mapTitle{position:absolute;right:32px;top:74px;z-index:6;font-size:13px;font-weight:900;color:#fff176;pointer-events:none}
#scoreBoard{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;padding:8px 20px;border-radius:999px;background:rgba(14,17,23,.72);border:1px solid rgba(255,255,255,.14);font-size:18px;font-weight:900;color:#fff176;display:flex;gap:16px;align-items:center}
</style>
</head>
<body>
<div id="app">
<video id="cameraVideo" autoplay playsinline muted></video>
<canvas id="skeletonCanvas" width="240" height="180"></canvas>
<canvas id="hiddenCanvas" width="160" height="120"></canvas>
<div id="threeLayer"></div>
<canvas id="fallbackCanvas"></canvas>

<div id="ui">
  <div class="row"><strong>🎨 涂鸦特工 · 街道版 v7 (修复版)</strong></div>
  <div class="row">
    <span class="pill">状态：<span id="stateText">初始化</span></span>
    <span class="pill">输入：<span id="inputMode">初始化</span></span>
    <span class="pill" id="camStablePill" style="display:none">体感：<span id="camStable" style="color:#ff9800">等待中</span></span>
  </div>
  <div class="row">
    <span class="pill">携带颜色：<span id="carriedDot" class="color-dot"></span><span id="carriedText">无</span></span>
    <span class="pill">目标区域：<span id="targetDot" class="color-dot"></span><span id="targetText">-</span></span>
  </div>
  <div class="row">
    <span>涂色进度</span>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <span id="progressText">0%</span>
  </div>
  <div id="tipText" style="color:#aab;font-size:12px;margin-top:4px">体感：左手向左伸=左转 右手向右伸=右转 单手上举=加速 握拳=停止 | 键鼠：A/D转向 W加速 S/空格停止 J喷涂</div>
</div>

<div id="scoreBoard">
  <span>🎨 <span id="paintedCount">0</span>/<span id="totalZones">0</span> 区块</span>
  <span>⭐ <span id="scoreVal">0</span></span>
</div>

<div id="controls">
  <button id="btnCamStart">📷 摄像头</button>
  <button id="btnCamStop">停止摄像头</button>
  <button id="btnReinit">🔄 重试检测</button>
  <button id="btnSim">键鼠模式</button>
  <button id="btnReset">重置 R</button>
</div>

<canvas id="miniMap" width="240" height="300"></canvas>
<div id="mapTitle">🗺 街道地图</div>
<div id="centerMessage">准备滑行！输入方向开始运动</div>
<div id="hintBottom">体感：左手向左伸=左转 右手向右伸=右转 单手上举=加速 握拳=停止 | 键鼠：A/D转向 W加速 S/空格停止 J喷涂</div>
<div id="debugPanel"></div>
<div id="errorBox"></div>
</div>

<script>
// ============================================================
// 参数配置
// ============================================================
const PARAMS = {
  moveSpeed: 4.2,
  boostSpeed: 5.8,
  laneWidth: 3.4,
  paintDuration: 2.5,
  collectRadius: 1.5,
  cameraLostFallback: 2
};

const COLORS = {
  none:   0xbfc4c9,
  red:    0xff4141,
  yellow: 0xffdf3d,
  blue:   0x36a3ff,
  green:  0x49ff88,
  pink:   0xff4fd8,
  cyan:   0x00e5ff,
  orange: 0xff8c00,
  road:   0x555a63,
  roadDark: 0x333840,
  sidewalk: 0x8a8e96
};

const COLOR_NAMES = { none:"无", red:"红", yellow:"黄", blue:"蓝", green:"绿", orange:"橙" };
const PAINT_COLORS = ['red','yellow','blue','green','orange'];

// ============================================================
// 路网定义
// ============================================================
const TURN_AHEAD_DISTANCE = 6.0;

const GRID_W = 12;
const GRID_H = 14;

const gridNodes = [];
for (let row = 0; row <= 4; row++) {
  for (let col = 0; col <= 6; col++) {
    gridNodes.push({
      id: row * 7 + col,
      col, row,
      x: (col - 3) * GRID_W,
      z: (row - 4) * GRID_H + 12
    });
  }
}

function nodeId(col, row) { return row * 7 + col; }
function getNode(col, row) { return gridNodes[nodeId(col, row)]; }

const roadSegments = [];
for (let row = 0; row <= 4; row++) {
  for (let col = 0; col < 6; col++) {
    roadSegments.push({ id: `h_${col}_${row}`, fromNode: nodeId(col, row), toNode: nodeId(col+1, row), open: true, paintColor: null, paintProgress: 0 });
  }
}
for (let row = 0; row < 4; row++) {
  for (let col = 0; col <= 6; col++) {
    roadSegments.push({ id: `v_${col}_${row}`, fromNode: nodeId(col, row), toNode: nodeId(col, row+1), open: true, paintColor: null, paintProgress: 0 });
  }
}

const blocks = [];
for (let row = 0; row < 4; row++) {
  for (let col = 0; col < 6; col++) {
    blocks.push({
      id: `block_${col}_${row}`,
      col, row,
      cx: ((col - 3) * GRID_W) + GRID_W/2,
      cz: ((row - 4) * GRID_H + 12) + GRID_H/2 - GRID_H,
      painted: false,
      targetColor: PAINT_COLORS[(col + row * 2) % PAINT_COLORS.length]
    });
  }
}

const canDefs = [];
const canColorCycle = ['red','yellow','blue','green','orange','red','yellow','blue','green','orange','red','yellow'];
let canIdx = 0;
[[1,2],[2,1],[4,2],[5,3],[3,0],[0,3],[6,1],[3,3],[1,0],[5,1],[2,3],[4,0]].forEach(([col,row]) => {
  const n = getNode(col, row);
  canDefs.push({ id: `can_${col}_${row}`, x: n.x, z: n.z, y: 1.2, colorType: canColorCycle[canIdx++], collected: false, radius: 1.5 });
});

// ============================================================
// 摄像头识别 - TensorFlow.js MoveNet 实时骨骼追踪 (v7 修复版)
// ============================================================
(function(){
  // ---- 基础变量 ----
  let video = null, sk = null, skctx = null;
  let stream = null;
  let frameLoopId = null;
  let detector = null;
  let detectorReady = false;
  let modelLoading = false;

  // ---- MoveNet 关键点定义 (17点) ----
  const KP = {
    NOSE: 0,
    LEFTEYE: 1, RIGHTEYE: 2,
    LEFTEAR: 3, RIGHTEAR: 4,
    LEFTSHOULDER: 5, RIGHTSHOULDER: 6,
    LEFELBOW: 7, RIGHTELBOW: 8,
    LEFTWRIST: 9, RIGHTWRIST: 10,
    LEFTHIP: 11, RIGHTHIP: 12,
    LEFTKNEE: 13, RIGHTKNEE: 14,
    LEFTANKLE: 15, RIGHTANKLE: 16
  };

  // ---- 骨骼连接定义 ----
  const BONES = [
    [5, 7], [7, 9],    // 左臂
    [6, 8], [8, 10],   // 右臂
    [5, 6],              // 肩膀
    [5, 11], [6, 12],  // 肩膀到髋部
    [11, 12],            // 髋部
    [11, 13], [13, 15], // 左腿
    [12, 14], [14, 16]  // 右腿
  ];

  // ---- 状态 ----
  const state = {
    enabled: false,
    ready: false,
    hasCamera: false,
    confidence: 0,
    bodyCenter: { x: 0.5, y: 0.5 },
    action: {
      horizontalIntent: 0,
      forwardBoostIntent: false,
      brakeHold: false,
      paintActive: false,
      waveUpTrigger: false,
      brakeTrigger: false
    },
    raw: { motionAmount: 0, leftHandUp: false, rightHandUp: false },
    nearIntersection: false,
    turnHint: ''
  };

  // ---- 手势检测历史 ----
  let prevLeftWrist = null, prevRightWrist = null;
  let prevLeftWristTime = 0, prevRightWristTime = 0;
  const DIRCOOLDOWNMS = 500;

  // ---- 警告系统 ----
  let wristWarningActive = false;
  let lastWarningTime = 0;

  // ---- 日志计数器 ----
  let logCounter = 0;

  // ============================================================
  // 初始化 MoveNet 检测器
  // ============================================================
  async function initDetector() {
    if (detector || modelLoading) return;
    modelLoading = true;

    try {
      console.log('[MoveNet v7] 开始加载...');
      await tf.ready();

      const model = poseDetection.SupportedModels.MoveNet;
      const config = {
        modelType: poseDetection.movenet.modelType.SINGLEPOSELIGHTNING,
        enableSmoothing: true,
        minPoseScore: 0.15
      };

      detector = await poseDetection.createDetector(model, config);
      detectorReady = true;
      modelLoading = false;
      console.log('[MoveNet v7] 加载成功！');
    } catch (e) {
      console.error('[MoveNet v7] 加载失败:', e);
      modelLoading = false;
      detectorReady = false;
    }
  }

  // ============================================================
  // 绘制骨骼到 canvas (v7 修复版)
  // ============================================================
  function drawSkeleton(keypoints) {
    if (!skctx) {
      console.warn('[drawSkeleton] skctx 为空！');
      return;
    }

    // 清空画布
    skctx.fillStyle = '#1a1d24';
    skctx.fillRect(0, 0, 240, 180);

    // 绘制摄像头画面（镜像）
    if (video && video.readyState >= 2) {
      skctx.save();
      skctx.translate(240, 0);
      skctx.scale(-1, 1);
      skctx.drawImage(video, 0, 0, 240, 180);
      skctx.restore();
    }

    // 调试：打印关键点信息
    if (logCounter % 30 === 0) {
      console.log('[drawSkeleton] keypoints 类型:', typeof keypoints, '是否为数组:', Array.isArray(keypoints), '长度:', keypoints ? keypoints.length : 'null');
      if (keypoints && keypoints[0]) {
        console.log('[drawSkeleton] keypoints[0]:', JSON.stringify(keypoints[0]));
      }
    }

    // 如果没有检测到关键点
    if (!keypoints || !keypoints.length) {
      skctx.fillStyle = '#ff4444';
      skctx.font = 'bold 11px sans-serif';
      skctx.textAlign = 'center';
      skctx.fillText('等待人体检测...', 120, 90);
      return;
    }

    // 计算置信度
    let validCount = 0;
    const requiredIndices = [5, 6, 7, 8, 9, 10]; // 肩膀、肘、腕
    requiredIndices.forEach(i => {
      if (keypoints[i] && keypoints[i].score > 0.3) validCount++;
    });
    const confidence = validCount / requiredIndices.length;

    // 绘制骨骼连接线
    skctx.strokeStyle = confidence > 0.35 ? '#00ff88' : '#ff4444';
    skctx.lineWidth = 2;

    BONES.forEach(([a, b]) => {
      const kp1 = keypoints[a];
      const kp2 = keypoints[b];
      
      if (kp1 && kp2 && kp1.score > 0.3 && kp2.score > 0.3) {
        // 坐标转换：MoveNet 返回的是像素坐标
        const x1 = (1 - kp1.x / 640) * 240;  // 翻转 x 坐标
        const y1 = (kp1.y / 480) * 180;
        const x2 = (1 - kp2.x / 640) * 240;  // 翻转 x 坐标
        const y2 = (kp2.y / 480) * 180;
        
        skctx.beginPath();
        skctx.moveTo(x1, y1);
        skctx.lineTo(x2, y2);
        skctx.stroke();
      }
    });

    // 绘制关键点
    keypoints.forEach((kp, i) => {
      if (!kp || kp.score < 0.3) return;
      
      // 坐标转换
      const x = (1 - kp.x / 640) * 240;  // 翻转 x 坐标
      const y = (kp.y / 480) * 180;
      
      // 设置颜色：鼻子用红色，其他用绿色
      skctx.fillStyle = i === 0 ? '#ff4444' : (confidence > 0.35 ? '#00ff88' : '#ff4444');
      
      // 绘制圆点
      skctx.beginPath();
      skctx.arc(x, y, i === 0 ? 5 : 3, 0, Math.PI * 2);
      skctx.fill();
    });

    // 绘制置信度条
    skctx.fillStyle = 'rgba(255,255,255,0.3)';
    skctx.fillRect(10, 10, 60, 4);
    skctx.fillStyle = confidence > 0.35 ? '#00ff88' : '#ff4444';
    skctx.fillRect(10, 10, 60 * confidence, 4);

    // 显示置信度文本
    skctx.fillStyle = '#fff';
    skctx.font = '9px monospace';
    skctx.textAlign = 'left';
    skctx.fillText('CONF: ' + (confidence * 100).toFixed(0) + '%', 10, 30);

    // 显示关键点数量
    skctx.fillText('KPS: ' + keypoints.length, 10, 45);

    logCounter++;
  }

  // ============================================================
  // 帧循环
  // ============================================================
  async function frameLoop() {
    if (!state.enabled) return;

    if (!video || video.readyState < 2) {
      frameLoopId = requestAnimationFrame(frameLoop);
      return;
    }

    if (detector && detectorReady) {
      try {
        // 注意：flipHorizontal = true 会自动翻转 x 坐标
        const poses = await detector.estimatePoses(video, { flipHorizontal: true });
        
        if (poses && poses.length > 0) {
          const keypoints = poses[0].keypoints;
          
          if (keypoints && keypoints.length > 0) {
            // 绘制骨骼
            drawSkeleton(keypoints);
            
            // 处理骨骼数据（用于游戏控制）
            processKeypoints(keypoints);
            
            if (logCounter % 30 === 0) {
              console.log('[帧循环] 检测到 ' + keypoints.length + ' 个关键点');
            }
          }
        }
      } catch (e) {
        console.warn('[MoveNet v7] 检测错误:', e.message);
      }
    }

    frameLoopId = requestAnimationFrame(frameLoop);
  }

  // ============================================================
  // 处理关键点数据（用于游戏控制）- 只识别手腕位置
  // ============================================================
  function processKeypoints(keypoints) {
    if (!keypoints || !keypoints.length) {
      state.confidence = 0;
      showCameraWarning('⚠️ 未检测到人体！');
      return;
    }

    const now = performance.now();

    // ---- 计算置信度（只检查手腕和肩膀）----
    let validCount = 0;
    const requiredIndices = [KP.LEFTSHOULDER, KP.RIGHTSHOULDER, KP.LEFTWRIST, KP.RIGHTWRIST];
    requiredIndices.forEach(i => {
      if (keypoints[i] && keypoints[i].score > 0.6) validCount++;  // 提高阈值到 0.6
    });
    state.confidence = validCount / requiredIndices.length;

    // ---- 获取关键点 ----
    const lw = keypoints[KP.LEFTWRIST];
    const rw = keypoints[KP.RIGHTWRIST];
    const ls = keypoints[KP.LEFTSHOULDER];
    const rs = keypoints[KP.RIGHTSHOULDER];

    // ---- 检查手腕是否检测到 ----
    const leftWristValid = lw && lw.score > 0.6;
    const rightWristValid = rw && rw.score > 0.6;

    if (!leftWristValid || !rightWristValid) {
      showCameraWarning('⚠️ 未检测到手腕！请面向摄像头');
    } else {
      clearCameraWarning();
    }

    // ---- 重置动作状态 ----
    state.action.horizontalIntent = 0;
    state.action.forwardBoostIntent = false;
    state.action.brakeHold = false;

    // ---- 加速：单手上举（手腕高于肩膀）----
    if (leftWristValid && ls && ls.score > 0.6) {
      if (lw.y < ls.y - 40) {  // 手腕比肩膀高 40 像素以上
        state.action.forwardBoostIntent = true;
        console.log('[MoveNet] 左手上举 → 加速！');
      }
    }

    if (rightWristValid && rs && rs.score > 0.6) {
      if (rw.y < rs.y - 40) {  // 手腕比肩膀高 40 像素以上
        state.action.forwardBoostIntent = true;
        console.log('[MoveNet] 右手上举 → 加速！');
      }
    }

    // ---- 转向：只识别手腕位置（相对于肩膀）----
    state.nearIntersection = checkNearIntersection();

    if (state.nearIntersection) {
      // 左转：左手手腕在左肩左侧（x 坐标更小）
      if (leftWristValid && ls && ls.score > 0.6) {
        const wristOffsetX = lw.x - ls.x;  // 负值表示手腕在肩膀左侧
        if (wristOffsetX < -50) {  // 手腕在肩膀左侧 50 像素以上
          state.action.horizontalIntent = -1;
          state.turnHint = 'left';
          console.log('[MoveNet] 左手在左肩左侧 → 左转！wristOffsetX=' + wristOffsetX.toFixed(1));
        }
      }

      // 右转：右手手腕在右肩右侧（x 坐标更大）
      if (rightWristValid && rs && rs.score > 0.6) {
        const wristOffsetX = rw.x - rs.x;  // 正值表示手腕在肩膀右侧
        if (wristOffsetX > 50) {  // 手腕在肩膀右侧 50 像素以上
          state.action.horizontalIntent = 1;
          state.turnHint = 'right';
          console.log('[MoveNet] 右手在右肩右侧 → 右转！wristOffsetX=' + wristOffsetX.toFixed(1));
        }
      }
    }

    // ---- 检查握拳（手腕靠近肘部）= 停止 ----
    const le = keypoints[KP.LEFTELBOW];
    const re = keypoints[KP.RIGHTELBOW];

    if (leftWristValid && le && le.score > 0.6) {
      const dist = Math.hypot(lw.x - le.x, lw.y - le.y);
      if (dist < 35) {  // 距离小于 35 像素
        state.action.brakeHold = true;
        console.log('[MoveNet] 左手握拳 → 停止！');
      }
    }

    if (rightWristValid && re && re.score > 0.6) {
      const dist = Math.hypot(rw.x - re.x, rw.y - re.y);
      if (dist < 35) {  // 距离小于 35 像素
        state.action.brakeHold = true;
        console.log('[MoveNet] 右手握拳 → 停止！');
      }
    }

    // ---- 更新历史位置 ----
    if (leftWristValid) {
      prevLeftWrist = { x: lw.x, y: lw.y };
      prevLeftWristTime = now;
    }

    if (rightWristValid) {
      prevRightWrist = { x: rw.x, y: rw.y };
      prevRightWristTime = now;
    }
  }

  // ============================================================
  // 警告系统 - 手腕未检测到时显示提醒
  // ============================================================
  function showCameraWarning(msg) {
    const now = performance.now();
    // 避免频繁刷警告（至少间隔 2 秒）
    if (now - lastWarningTime < 2000) return;
    lastWarningTime = now;

    const debugPanel = document.getElementById('debugPanel');
    if (debugPanel) {
      debugPanel.style.display = 'block';
      debugPanel.style.color = '#ff4444';
      debugPanel.innerHTML = msg + '<br>' + debugPanel.innerHTML;
    }
    console.warn('[MoveNet]', msg);
  }

  function clearCameraWarning() {
    const debugPanel = document.getElementById('debugPanel');
    if (debugPanel) {
      debugPanel.style.color = '#aaa';
    }
  }

  // ============================================================
  // 检查是否接近路口
  // ============================================================
  function checkNearIntersection() {
    try {
      const p = Game ? Game.player : null;
      if (!p || !p.currentSegment) return false;

      const seg = p.currentSegment;
      const nA = gridNodes[seg.fromNode];
      const nB = gridNodes[seg.toNode];
      const len = Math.hypot(nB.x - nA.x, nB.z - nA.z);

      const distToEnd = p.segDir > 0 ? (1 - p.segT) * len : p.segT * len;
      return distToEnd < TURN_AHEAD_DISTANCE;
    } catch(e) {
      return false;
    }
  }

  // ============================================================
  // 启动摄像头
  // ============================================================
  async function start() {
    video = document.getElementById('cameraVideo');
    sk = document.getElementById('skeletonCanvas');
    skctx = sk.getContext('2d');
    sk.style.display = 'block';

    console.log('[Camera v7] 启动摄像头...');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      console.error('[Camera v7] 不支持 getUserMedia');
      return false;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });

      video.srcObject = stream;
      video.style.display = 'block';
      sk.style.display = 'block';

      await new Promise((resolve) => {
        if (video.readyState >= 2) resolve();
        else {
          video.onloadedmetadata = resolve;
          setTimeout(resolve, 3000);
        }
      });
      await video.play();

      console.log('[Camera v7] 视频已就绪');

      // 初始化检测器
      await initDetector();

      state.enabled = state.ready = state.hasCamera = true;
      frameLoop();

      if (detectorReady) {
        showCenterMessage("MoveNet 骨骼追踪已开启!", 2000);
      } else {
        showCenterMessage("摄像头已开启（MoveNet加载中...）", 2000);
      }

      setInputModeUI("体感+键鼠");
      return true;

    } catch (e) {
      console.error('[Camera v7] 启动失败:', e);
      state.enabled = state.ready = state.hasCamera = false;
      setInputModeUI("键鼠/触摸");
      showCenterMessage("摄像头不可用，已切换键鼠模式", 1800);
      return false;
    }
  }

  // ============================================================
  // 停止摄像头
  // ============================================================
  function stop() {
    if (frameLoopId) {
      cancelAnimationFrame(frameLoopId);
      frameLoopId = null;
    }
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    if (video) {
      video.pause();
      video.srcObject = null;
      video.style.display = 'none';
    }
    if (sk) sk.style.display = 'none';

    state.enabled = state.ready = state.hasCamera = false;
    state.confidence = 0;
    prevLeftWrist = null;
    prevRightWrist = null;

    setInputModeUI("键鼠/触摸");
  }

  // ============================================================
  // 获取状态
  // ============================================================
  function tick() {
    return state;
  }

  function getState() {
    return {
      ...state,
      turnHint: state.turnHint,
      nearIntersection: state.nearIntersection
    };
  }

  // 导出
  window.LocalCameraRecognizer = { start, stop, tick, getState };

  console.log('[Camera v7] 姿态检测模块已加载');
})();

// ============================================================
// 输入系统
// ============================================================
const Input={
  horizontalIntent:0,forwardBoostIntent:false,reverseIntent:false,
  brakeHold:false,paintActive:false,lastSource:"键鼠/触摸",
  keys:{},pointerDown:false,pointerStartX:0,pointerX:0,pointerY:0,
  pointerLastX:0,pointerLastY:0,pointerMotion:0,pointerDownTime:0,
  lastDirChange:0,lastBrake:0,
  stopped:false,
  update(dt){
    let now=performance.now()/1000,ki=0,kb=false,kr=false,kbr=false,kp=false;
    if(this.keys.ArrowLeft||this.keys.KeyA)ki=-1;
    if(this.keys.ArrowRight||this.keys.KeyD)ki=1;
    if(this.keys.ArrowUp||this.keys.KeyW)kb=true;
    if(this.keys.Space)kbr=true;
    if(this.keys.KeyJ)kp=true;
    let pi=0,pbr=false,pp=false;
    if(this.pointerDown){
      let dx=this.pointerX-this.pointerStartX,dead=Math.max(36,innerWidth*.08);
      pi=dx<-dead?-1:dx>dead?1:0;
      let mdx=this.pointerX-this.pointerLastX,mdy=this.pointerY-this.pointerLastY;
      this.pointerMotion=this.pointerMotion*.82+Math.hypot(mdx,mdy)*.18;
      pp=this.pointerMotion>4.5;pbr=now-this.pointerDownTime>.45&&this.pointerMotion<2.2
    }else this.pointerMotion*=.85;
    let cam=LocalCameraRecognizer.getState(),
      ca=cam.enabled&&cam.ready&&(cam.confidence>.08||cam.action.brakeHold||cam.action.forwardBoostIntent||cam.action.brakeTrigger||cam.action.waveUpTrigger)?cam.action:null;
    let di=0,bo=false,rv=false,br=false,pa=false,src="键鼠/触摸";
    if(ki||kb||kbr||kp){di=ki;bo=kb;rv=kr;br=this.stopped&&!kb||kbr;pa=kp;src="键盘"}
    else if(this.pointerDown){di=pi;br=this.stopped||pbr;pa=pp;src="鼠标/触摸"}
    else if(ca){
      if(ca.brakeTrigger) this.stopped=!this.stopped;
      if(ca.waveUpTrigger){
        if(this.stopped) this.stopped=false;
        else bo=true;
      }
      di=ca.horizontalIntent;
      bo=bo||ca.forwardBoostIntent;
      br=this.stopped||ca.brakeHold;
      src=br?"体感（握拳）":bo?"体感（加速）":di!==0?"体感（"+("left"===(ca.turnHint||(di<0?"left":"right"))?"左":"右")+"转）":"体感";
    }
    if(di!==this.horizontalIntent&&(now-this.lastDirChange>.2||di===0)){this.horizontalIntent=di;this.lastDirChange=now}
    this.brakeHold=br;this.forwardBoostIntent=bo;this.reverseIntent=rv;this.paintActive=pa;this.lastSource=src;
    this.pointerLastX=this.pointerX;this.pointerLastY=this.pointerLastY
  }
};

addEventListener("keydown",e=>{Input.keys[e.code]=true;if(e.code==="KeyR")resetGame();});
addEventListener("keyup",e=>Input.keys[e.code]=false);
addEventListener("keydown",e=>{if(e.code==="ArrowDown"||e.code==="KeyS"){Input.stopped=!Input.stopped}});
addEventListener("pointerdown",e=>{Input.pointerDown=true;Input.pointerStartX=Input.pointerX=Input.pointerLastX=e.clientX;Input.pointerY=Input.pointerLastY=e.clientY;Input.pointerMotion=0;Input.pointerDownTime=performance.now()/1000});
addEventListener("pointermove",e=>{Input.pointerX=e.clientX;Input.pointerY=e.clientY});
addEventListener("pointerup",()=>Input.pointerDown=false);

document.getElementById('btnCamStart').onclick=()=>LocalCameraRecognizer.start();
document.getElementById('btnCamStop').onclick=()=>LocalCameraRecognizer.stop();
document.getElementById('btnReinit').onclick=()=>{
  LocalCameraRecognizer.stop();
  setTimeout(() => LocalCameraRecognizer.start(), 300);
  showCenterMessage("重新初始化摄像头...", 1500);
};
document.getElementById('btnSim').onclick=()=>{LocalCameraRecognizer.stop();setInputModeUI("键鼠/触摸");showCenterMessage("已切换键鼠模式",1200)};
document.getElementById('btnReset').onclick=()=>resetGame();

// ============================================================
// WebGL 检测 & 2D 兜底渲染
// ============================================================
const Fallback2D = {
  ctx: null,
  ready: false,

  init() {
    const cvs = document.getElementById('fallbackCanvas');
    if (!cvs) return;
    cvs.style.display = 'block';
    this.ctx = cvs.getContext('2d');
    this.ready = true;
    this.resize();
    addEventListener('resize', () => this.resize());
  },

  resize() {
    const cvs = document.getElementById('fallbackCanvas');
    if (cvs) { cvs.width = innerWidth; cvs.height = innerHeight; }
  },

  draw(t) {
    if (!this.ready || !this.ctx) return;
    const ctx = this.ctx;
    const w = innerWidth, h = innerHeight;

    ctx.fillStyle = '#1a1d24';
    ctx.fillRect(0, 0, w, h);

    // 绘制简单 2D 兜底内容
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('WebGL 不可用，请检查浏览器设置', w/2, h/2);
  }
};

// ============================================================
// 工具函数
// ============================================================
function showCenterMessage(msg, duration) {
  const div = document.getElementById('centerMessage');
  if (!div) return;
  div.textContent = msg;
  div.style.opacity = '1';
  setTimeout(() => { div.style.opacity = '0'; }, duration || 2000);
}

function setInputModeUI(mode) {
  const span = document.getElementById('inputMode');
  if (span) span.textContent = mode;
}

  player: null
};

  console.log('重置游戏');
  showCenterMessage('游戏已重置', 1500);
}
